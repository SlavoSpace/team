        var imie = o.imie || o.login;
        return '<div class="dw-kafel-w"><button type="button" class="dw-kafel" data-dw="osoba" data-v="' + esc(o.login) + '" data-test="osoba-' + esc(o.login) + '"' + (S.edycja ? ' disabled' : '') + '>' +
          awatar(o) + '<span class="dw-kafel-imie">' + esc(imie) + '</span>' +
          '<span class="dw-kafel-rola">' + (o.podpis ? esc(o.podpis) : '<span class="dw-mono">' + esc(o.login) + '</span>') + (o.ua ? '<span class="dw-znacznik">UA</span>' : '') + '</span></button>' +
          (S.edycja ? '<button type="button" class="dw-kafel-x" data-dw="zapomnij" data-v="' + esc(o.login) + '" aria-label="Usuń ' + esc(imie) + ' z tego urządzenia">×</button>' : '') + '</div>';
      }).join('');
      return '<div class="dw-uklad"><div>' +
        (K.edycja && K.zapomnij
          ? '<div class="dw-rzad"><span class="dw-etykieta">' + T(K.kto) + '</span><button type="button" class="dw-link dw-link-maly" data-dw="edycja" data-test="edytuj-liste">' + (S.edycja ? 'Gotowe' : 'Edytuj listę') + '</button></div>'
          : '<div><span class="dw-etykieta">' + T(K.kto) + '</span></div>') +
        htmlWiad() + '<div class="dw-kafelki">' + k + (S.edycja ? '' : '<button type="button" class="dw-kafel dw-kafel-inna" data-dw="inna" data-test="inna-osoba">' + htmlInna() + '</button>') + '</div>' +
        (S.edycja ? '<p class="dw-uwaga">Usunięcie kafelka nie usuwa konta — osoba zaloguje się znowu przez „Inna osoba”.</p>' : '') +
        '</div>' + htmlZdz(K.zdzKafelki) + '</div>';
    }
    function htmlLogin() {
      return '<div class="dw-uklad"><form class="dw-form" data-dw-form="login" autocomplete="off" novalidate>' + htmlWiad() +
        '<div class="dw-pole"><label class="dw-etykieta" for="' + id('login') + '">' + T(K.etykietaLogin) + '</label>' +
        '<input id="' + id('login') + '" data-dw-pole="login" data-test="login" type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" enterkeyhint="next" placeholder="' + esc(K.placeholder) + '" value="' + esc(S.login) + '">' +
        '<span class="dw-pomoc">' + TL(K.pomoc) + '</span>' +
        '<span class="dw-blad" role="alert" data-test="blad-loginu"' + (S.blad ? '' : ' hidden') + '>' + esc(S.blad) + '</span></div>' +
        '<button type="submit" class="dw-glowny" data-test="dalej">' + T(K.dalej) + '</button>' +
        (osoby().length ? '<button type="button" class="dw-link" data-dw="kafelki" data-test="do-kafelkow">' + ik('wstecz', 'dw-mala') + ' Wróć do kafelków</button>' : '') +
        '</form>' + htmlZdz(K.zdzLogin) + '</div>';
    }
    function htmlKropki() {
      var ile = Math.min(Math.max(dlZnana() || 6, S.pin.length), K.maxPin), h = '';
      for (var i = 0; i < ile; i++) h += '<span class="' + (i < S.pin.length ? 'dw-p' : '') + '"></span>';
      return h;
    }
    function komunikat() {
      if (S.wysyla) return { r: 'czeka', kl: '', t: S.otwiera ? 'Otwieram…' : 'Sprawdzam…' };
      if (S.czekaDo > Date.now() && S.blad) return { r: 'blad', kl: ' dw-pin-blad', t: S.blad, alert: true };   // serwer podał godzinę
      var lok = lokalnaMs();
      if (lok > 0) return { r: 'blad', kl: ' dw-pin-blad', t: 'Za dużo prób — spróbuj za ' + Math.max(1, Math.ceil(lok / 1000)) + ' s', alert: true };
      if (S.blad) return { r: 'blad', kl: ' dw-pin-blad', t: S.blad, alert: true };
      if (S.info) return { r: 'info', kl: S.infoRodzaj === 'uwaga' ? ' dw-pin-uwaga' : ' dw-pin-ok', t: S.info };
      var dl = dlZnana();
      return { r: 'zwykly', kl: '', t: dl ? 'PIN ma ' + dl + ' cyfr.' : K.podpowiedzPin };
    }
    function htmlPin() {
      var o = S.osoba, imie = o.imie || o.login, zab = zablokowanyMs() > 0, wyl = (S.wysyla || zab) ? ' disabled' : '';
      var klaw = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (n) {
        return '<button type="button" class="dw-kl" data-dw="cyfra" data-v="' + n + '" data-test="pin-' + n + '"' + wyl + '>' + n + '</button>';
      }).join('') +
        '<button type="button" class="dw-kl dw-maly" data-dw="cofnij" data-test="pin-cofnij" aria-label="Usuń cyfrę"' + (S.wysyla ? ' disabled' : '') + '>⌫</button>' +
        '<button type="button" class="dw-kl" data-dw="cyfra" data-v="0" data-test="pin-0"' + wyl + '>0</button>' +
        '<button type="button" class="dw-kl dw-ok-kl" data-dw="pin-ok" data-test="pin-zaloguj" aria-label="Zaloguj"' + (S.pin.length >= 6 && !S.wysyla && !zab ? '' : ' disabled') + '>' + ik('ok') + '</button>';
      var km = komunikat(), notka = '';
      if (K.notkaPin) { try { notka = K.notkaPin(o) || ''; } catch (e) { notka = ''; } }
      return '<div class="dw-pin-uklad"><div class="dw-pin' + (S.wysyla ? ' dw-wysyla' : '') + '" data-dw-pin>' +
        awatar(o, 'dw-duzy') +
        '<div class="dw-pin-imie" data-test="pin-osoba">' + esc(imie) + '</div>' +
        '<div class="dw-pin-pod">' + (o.imie && String(o.imie).toLowerCase() !== String(o.login).toLowerCase() ? '<span class="dw-mono">' + esc(o.login) + '</span> · ' : '') + T(K.wpiszPin) + '</div>' +
        '<div class="dw-kropki" data-dw-kropki aria-live="polite" aria-label="Wpisano ' + S.pin.length + ' cyfr">' + htmlKropki() + '</div>' +
        '<div class="dw-pin-hint' + km.kl + '" data-dw-komunikat data-test="pin-komunikat" data-rodzaj="' + km.r + '"' + (km.alert ? ' role="alert"' : ' role="status"') + '>' + T(km.t) + '</div>' +
        '<div class="dw-klaw" data-dw-klaw>' + klaw + '</div>' +
        '<div class="dw-pin-linki"><button type="button" class="dw-link" data-dw="wroc" data-test="pin-wroc">' + ik('wstecz', 'dw-mala') + ' Inna osoba</button>' +
        (K.prosba ? '<button type="button" class="dw-link" data-dw="prosba" data-test="pin-prosba">Nie pamiętam PIN-u</button>' : '') + '</div>' +
        (notka ? '<div class="dw-pin-notka">' + T(notka) + '</div>' : '') +
        '</div><div class="dw-pin-zdz">' + zdz('tyl', 'ZDZISŁAW stoi tyłem — widać ważkę na głowie i baterię atomową') + '<p>' + T(K.zdzPin) + '</p></div></div>';
    }
    function html() {
      var tresc = S.krok === 'pin' && S.osoba ? htmlPin() : (S.krok === 'login' || !osoby().length ? htmlLogin() : htmlKafelki());
      return '<div class="dw-w">' +
        '<div class="dw-gora"><div><h1 class="dw-logo dw-bebas">' + esc(K.nazwa) + '</h1>' +
        '<span class="dw-pod' + (K.pokaz ? ' dw-pokaz' : '') + '">' + T(K.opis) + '</span></div>' + htmlMotyw() + '</div>' +
        tresc +
        (K.link && K.link.tekst ? '<a class="dw-dolny" href="' + esc(K.link.href || '#') + '" data-test="link-dolny">' + T(K.link.tekst) + '</a>' : '') +
        '</div>';
    }

    /* ───────────── rysowanie ───────────── */
    function rysuj() {
      if (!root) return;
      var a = document.activeElement, bylFokusLoginu = a && a.getAttribute && a.getAttribute('data-dw-pole') === 'login' && root.contains(a);
      root.className = 'dw ' + (motyw() === 'jasny' ? 'dw-jasny' : 'dw-ciemny');
      root.setAttribute('data-modul', K.modul);
      root.setAttribute('data-krok', S.krok === 'pin' && S.osoba ? 'pin' : (S.krok === 'login' || !osoby().length ? 'login' : 'kafelki'));
      root.innerHTML = html();
      if (root.getAttribute('data-krok') === 'login') {
        var i = root.querySelector('[data-dw-pole="login"]');
        if (i && (bylFokusLoginu || !S.blad)) setTimeout(function () { if (S.widoczny && i.isConnected && document.activeElement !== i) { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } } }, 30);
      }
      zaplanujOdliczanie();
    }
    /* PIN: przy każdej cyfrze odświeżamy tylko kropki, komunikat i klawisze — ZDZISŁAW nie miga od nowa */
    function odswiezPin() {
      if (!root || root.getAttribute('data-krok') !== 'pin') { rysuj(); return; }
      var pin = root.querySelector('[data-dw-pin]'), kr = root.querySelector('[data-dw-kropki]'), km = root.querySelector('[data-dw-komunikat]');
      if (!pin || !kr || !km) { rysuj(); return; }
      pin.classList.toggle('dw-wysyla', !!S.wysyla);
      kr.innerHTML = htmlKropki(); kr.setAttribute('aria-label', 'Wpisano ' + S.pin.length + ' cyfr');
      var k = komunikat();
      km.className = 'dw-pin-hint' + k.kl; km.setAttribute('role', k.alert ? 'alert' : 'status'); km.setAttribute('data-rodzaj', k.r); km.innerHTML = T(k.t);
      var zab = zablokowanyMs() > 0;
      Array.prototype.forEach.call(root.querySelectorAll('[data-dw="cyfra"]'), function (b) { b.disabled = !!(S.wysyla || zab); });
      var c = root.querySelector('[data-dw="cofnij"]'); if (c) c.disabled = !!S.wysyla;
      var ok = root.querySelector('[data-dw="pin-ok"]'); if (ok) ok.disabled = !(S.pin.length >= 6 && !S.wysyla && !zab);
      zaplanujOdliczanie();
    }
    function zaplanujOdliczanie() {
      clearTimeout(odliczT);
      if (!S.widoczny || S.krok !== 'pin') return;
      if (lokalnaMs() > 0) { S.byloOdliczanie = true; odliczT = setTimeout(odswiezPin, 1000); }
      else if (S.byloOdliczanie) { S.byloOdliczanie = false; S.blad = ''; odliczT = setTimeout(odswiezPin, 0); }   // po minucie — czysto, bez starego błędu
    }
    function potrzasnij() {
      var p = root && root.querySelector('[data-dw-pin]');
      if (!p) return;
      p.classList.remove('dw-potrzasnij'); void p.offsetWidth; p.classList.add('dw-potrzasnij');
    }
    function zaplanujMrug() {
      clearTimeout(mrugT);
      if (!S.widoczny || !OBRAZY.powitanie_mrug) return;
      mrugT = setTimeout(function () {
        if (root) Array.prototype.forEach.call(root.querySelectorAll('[data-dw-poza="powitanie"] img'), function (z) {
          z.src = OBRAZY.powitanie_mrug;
          setTimeout(function () { if (z.isConnected) z.src = OBRAZY.powitanie; }, 150);
        });
        zaplanujMrug();
      }, 3200 + Math.random() * 3800);
    }

    /* ───────────── kroki ───────────── */
    function doPinu(o) {
      S.wiad = null;
      S.osoba = o; S.krok = 'pin'; S.pin = ''; S.blad = ''; S.info = ''; S.poBledzie = false; S.wysyla = false; S.otwiera = false;
      rysuj();
    }
    function doStartu() {
      S.osoba = null; S.pin = ''; S.blad = ''; S.info = ''; S.wysyla = false; S.otwiera = false; S.edycja = false;
      S.krok = osoby().length ? 'kafelki' : 'login';
      rysuj();
    }
    function dalejZLoginu() {
      var l = S.login.trim();
      if (!l) { S.blad = 'Wpisz login.'; rysuj(); return; }
      if (!/^[A-Za-z0-9][A-Za-z0-9._@+-]{1,39}$/.test(l)) { S.blad = 'Login to litery i cyfry (stare loginy także z kropką).'; rysuj(); return; }
      var z = osoby().filter(function (x) { return String(x.login).toLowerCase() === l.toLowerCase(); })[0];
      S.blad = '';
      doPinu(z || { login: l, imie: l, dl: 0 });
    }
    function cyfra(c) {
      if (S.krok !== 'pin' || S.wysyla || zablokowanyMs() > 0 || S.pin.length >= K.maxPin) return;
      S.pin += c; S.blad = ''; S.info = '';
      var dl = dlZnana();
      if (dl && S.pin.length === dl) { wyslij(); return; }
      odswiezPin();
    }
    function cofnij() { if (S.wysyla) return; S.pin = S.pin.slice(0, -1); odswiezPin(); }
    function wyslij() {
      if (S.wysyla || !S.osoba) return;
      if (zablokowanyMs() > 0) { odswiezPin(); return; }
      if (S.pin.length < 6) { S.blad = 'PIN ma co najmniej 6 cyfr.'; odswiezPin(); potrzasnij(); return; }
      if (!K.zaloguj) { S.blad = 'Logowanie nie jest podłączone.'; odswiezPin(); return; }
      var pin = S.pin, osoba = S.osoba;
      S.wysyla = true; S.blad = ''; S.info = ''; odswiezPin();
      Promise.resolve().then(function () { return K.zaloguj(osoba, pin); }).then(function () {
        S.pin = ''; S.otwiera = true;            // moduł zwykle już schował okno; jeśli nie — „Otwieram…”
        if (S.widoczny && S.krok === 'pin') odswiezPin();
      }, function (e) {
        S.wysyla = false; S.otwiera = false; S.pin = ''; S.poBledzie = true;
        S.blad = (e && e.message) || 'Nie udało się zalogować.';
        if (e && e.status === 429) {
          var dt = e.czeka_do ? new Date(e.czeka_do).getTime() - Date.now() : 60e3;
          if (!(dt > 0)) dt = 60e3;
          S.czekaDo = Date.now() + Math.min(Math.max(dt, 1000), 16 * 60e3);
          clearTimeout(czekaT);
          czekaT = setTimeout(function () { S.czekaDo = 0; if (S.widoczny && S.krok === 'pin') { S.blad = ''; odswiezPin(); } }, S.czekaDo - Date.now());
        }
        if (S.widoczny) { if (S.krok === 'pin') { odswiezPin(); potrzasnij(); } }
      });
    }
    function prosba() {
      if (!K.prosba || !S.osoba || S.wysyla) return;
      S.blad = ''; S.info = 'Wysyłam prośbę…'; S.infoRodzaj = 'ok'; odswiezPin();
      Promise.resolve().then(function () { return K.prosba(S.osoba.login); }).then(function () {
        S.info = 'Prośba wysłana. Zarządca zobaczy ją w managerze — nowy PIN dostaniesz osobiście.'; odswiezPin();
      }, function (e) {
        S.info = ''; S.blad = (e && e.message) || 'Nie udało się wysłać prośby — spróbuj za chwilę.'; odswiezPin();
      });
    }

    /* ───────────── zdarzenia ───────────── */
    var AKCJE = {
      motyw: function (el) {
        var m = el.getAttribute('data-v') === 'jasny' ? 'jasny' : 'ciemny';
        try { K.ustawMotyw(m); } catch (e) { /* moduł bez motywu */ }
        root.className = 'dw ' + (motyw() === 'jasny' ? 'dw-jasny' : 'dw-ciemny');
        Array.prototype.forEach.call(root.querySelectorAll('[data-dw="motyw"]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === motyw())); });
      },
      osoba: function (el) { var v = el.getAttribute('data-v'); var o = osoby().filter(function (x) { return x.login === v; })[0]; if (o) doPinu(o); },
      inna: function () { S.krok = 'login'; S.login = ''; S.blad = ''; S.wiad = null; rysuj(); },
      kafelki: function () { S.krok = 'kafelki'; S.blad = ''; rysuj(); },
      edycja: function () { S.edycja = !S.edycja; rysuj(); },
      zapomnij: function (el) {
        if (!K.zapomnij) return;
        try { K.zapomnij(el.getAttribute('data-v')); } catch (e) { /* zostaje na liście */ }
        if (!osoby().length) { S.edycja = false; S.krok = 'login'; }
        rysuj();
      },
      cyfra: function (el) { cyfra(el.getAttribute('data-v')); },
      cofnij: cofnij,
      'pin-ok': wyslij,
      wroc: doStartu,
      prosba: prosba
    };
    function naKlik(e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-dw]') : null;
      if (!el || !root.contains(el) || el.disabled) return;
      var a = AKCJE[el.getAttribute('data-dw')];
      if (a) { e.preventDefault(); a(el); }
    }
    function naWyslanie(e) {
      if (e.target && e.target.getAttribute && e.target.getAttribute('data-dw-form') === 'login') { e.preventDefault(); dalejZLoginu(); }
    }
    function naWpis(e) {
      var t = e.target;
      if (!t || !t.getAttribute || t.getAttribute('data-dw-pole') !== 'login') return;
      var v = t.value.replace(/\s/g, '');
      if (v !== t.value) t.value = v;
      S.login = v;
      if (S.blad) { S.blad = ''; var b = root.querySelector('[data-test="blad-loginu"]'); if (b) { b.textContent = ''; b.hidden = true; } }
    }
    function naKlawisz(e) {
      if (!S.widoczny || S.krok !== 'pin' || !S.osoba || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (/^\d$/.test(e.key)) { e.preventDefault(); cyfra(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); cofnij(); }
      else if (e.key === 'Enter') { e.preventDefault(); wyslij(); }
      else if (e.key === 'Escape') { e.preventDefault(); doStartu(); }
    }

    function zbudujRoot() {
      if (root) return;
      wstawCss();
      root = document.createElement('div');
      root.className = 'dw dw-ciemny';
      root.id = 'dysza-wejscie' + (nr > 1 ? '-' + nr : '');
      if (K.zIndex != null) root.style.zIndex = String(K.zIndex);   // np. pod okienkami i dymkami modułu
      root.hidden = true;
      root.addEventListener('click', naKlik);
      root.addEventListener('submit', naWyslanie);
      root.addEventListener('input', naWpis);
      document.body.appendChild(root);
    }

    var API = {
      wersja: WERSJA,
      /* opcje: { krok: 'kafelki'|'login'|'pin', osoba: {login, imie, dl, …}, komunikat: 'tekst', rodzaj: 'blad'|'uwaga'|'info'|'ok' }
         — komunikat na PIN-ie: pomarańczowy (uwaga) albo zielony (ok); na kafelkach i przy loginie: czerwony (blad), pomarańczowy, szary (info) */
      pokaz: function (opcje) {
        opcje = opcje || {};
        zbudujRoot();
        var czekaDo = S.czekaDo;                   // blokada z serwera trwa także po powrocie do okna
        S = nowyStan(); S.czekaDo = czekaDo;
        if (opcje.krok === 'pin' && opcje.osoba && opcje.osoba.login) { S.krok = 'pin'; S.osoba = opcje.osoba; }
        else if (opcje.krok === 'login' || !osoby().length) S.krok = 'login';
        else S.krok = 'kafelki';
        if (opcje.komunikat) {
          if (S.krok === 'pin') { S.info = String(opcje.komunikat); S.infoRodzaj = opcje.rodzaj === 'ok' ? 'ok' : 'uwaga'; }
          else S.wiad = { t: String(opcje.komunikat), r: opcje.rodzaj || 'blad' };      // rodzaj: 'blad' | 'uwaga' | 'info'
        }
        if (opcje.login) S.login = String(opcje.login);
        S.widoczny = true;
        root.hidden = false;
        document.addEventListener('keydown', naKlawisz);
        rysuj();
        zaplanujMrug();
        try { root.scrollTop = 0; } catch (e) { /* stare przeglądarki */ }
        return API;
      },
      ukryj: function () {
        S.widoczny = false;
        clearTimeout(mrugT); clearTimeout(odliczT);
        document.removeEventListener('keydown', naKlawisz);
        if (root) { root.hidden = true; root.innerHTML = ''; }
        return API;
      },
      odswiez: function () { if (S.widoczny) { if (S.krok === 'pin') odswiezPin(); else rysuj(); } return API; },
      widoczne: function () { return !!S.widoczny; },
      ustaw: function (zmiany) { for (var z in (zmiany || {})) K[z] = zmiany[z]; if (S.widoczny) rysuj(); return API; },
      zniszcz: function () {
        API.ukryj();
        if (root) {
          root.removeEventListener('click', naKlik); root.removeEventListener('submit', naWyslanie); root.removeEventListener('input', naWpis);
          if (root.parentNode) root.parentNode.removeChild(root);
          root = null;
        }
      },
      _stan: function () { return S; }
    };
    return API;
  }

  window.DyszaWejscie = { wersja: WERSJA, utworz: utworz };
})();
</script>
<script>
/* Generator harmonogramu — team.dysza.app (prototyp)
   Zapotrzebowanie (profil dnia tygodnia × prognoza dnia) → dostępność (deklaracje + nawyki)
   → poziom sprawiedliwości (water-filling w obrębie roli) → układanie od najtrudniejszych dni → wymiany wyrównujące. */
(function (root) {
  'use strict';
  var ROLE_ORDER = ['Szef', 'Kucharz', 'Pomoc', 'Obsługa', 'Kelner', 'Zmywak', 'Dyspozytor', 'Magazyn', 'Pakowanie'];

  function rng(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function wdOf(y, m, d) { return (new Date(y, m - 1, d).getDay() + 6) % 7; } // pon=0 … nd=6

  function gini(xs) {
    var v = xs.filter(function (x) { return x >= 0; }).slice().sort(function (a, b) { return a - b; });
    var n = v.length; if (n < 2) return 0;
    var sum = 0, cum = 0; for (var i = 0; i < n; i++) { sum += v[i]; cum += (i + 1) * v[i]; }
    if (sum === 0) return 0;
    return (2 * cum) / (n * sum) - (n + 1) / n;
  }

  /* mnożnik obsady dla dnia i miejsca */
  function multiplier(day, loc) {
    if (day.mode === 'closed') return 0;
    if (day.mode === 'boost') return 1.3;
    if (day.mode === 'normal') return 1;
    return loc === 'F' ? day.mF : day.mR; // 'forecast'
  }

  function demandOf(DATA, day) {
    var out = {};
    Object.keys(DATA.prof).forEach(function (key) {
      var parts = key.split('|'), role = parts[0], loc = parts[1];
      var base = DATA.prof[key].n[day.wd];
      var m = multiplier(day, loc);
      var n = m === 0 ? 0 : (role === 'Magazyn' ? base : Math.round(base * m));
      if (n > 0) out[key] = n;
    });
    return out;
  }

  function eligibility(DATA, p, lokOv) {
    var tot = p.lok.F + p.lok.R, el = {};
    ['F', 'R'].forEach(function (loc) {
      if (!DATA.prof[p.rola + '|' + loc]) return;
      if (lokOv) { if (lokOv[loc]) el[loc] = tot && p.lok[loc] > 0 ? Math.max(0.3, p.lok[loc] / tot) : 0.4; return; }
      if (tot === 0) {
        var nF = DATA.prof[p.rola + '|F'] ? DATA.prof[p.rola + '|F'].n.reduce(function (a, b) { return a + b; }, 0) : 0;
        var nR = DATA.prof[p.rola + '|R'] ? DATA.prof[p.rola + '|R'].n.reduce(function (a, b) { return a + b; }, 0) : 0;
        el[loc] = (loc === 'F' ? nF : nR) / Math.max(1, nF + nR);
      } else if (p.lok[loc] > 0) {
        el[loc] = p.lok[loc] / tot;
      }
    });
    return el;
  }

  function generate(DATA, opts) {
    var Y = opts.year, M = opts.month, N = opts.days.length;
    var days = opts.days; // [{d, wd, mode, mF, mR}]
    var decl = opts.decl || {};
    var maxStreak = opts.maxStreak || 6, maxMonth = opts.maxMonth || 22;
    var rand = rng(opts.seed || 7);

    var people = DATA.people.filter(function (p) {
      if (p.rola === 'Zarząd') return !!(decl[p.id] && decl[p.id].dod && decl[p.id].dod.length); // zarząd tylko jako zastępstwo w dodatkowych rolach
      if (opts.include && opts.include[p.id] === false) return false;
      if (opts.include && opts.include[p.id] === true) return true;
      return p.akt;
    }).map(function (p) {
      var dc = decl[p.id] || {};
      var tot = p.lok.F + p.lok.R;
      return { p: p, id: p.id, rola: p.rola, el: eligibility(DATA, p, dc.lok), off: dc.off || {}, dmax: (dc.max == null ? null : dc.max), want: dc.want || {}, lpref: dc.loc || null,
        dod: dc.dod || [], locs: dc.lok ? { F: !!dc.lok.F, R: !!dc.lok.R } : { F: tot === 0 || p.lok.F > 0, R: tot === 0 || p.lok.R > 0 }, dn: dc.dn || p.dn, rates: dc.rates || {}, smOk: !!dc.sm, smRate: dc.smRate || 0,
        a: 0, we: 0, by: {}, F: 0, R: 0, alt: {}, sm: {}, smN: 0 };
    });
    var byRole = {}; ROLE_ORDER.forEach(function (r) { byRole[r] = []; });
    people.forEach(function (x) { (byRole[x.rola] = byRole[x.rola] || []).push(x); });

    /* 1. Zapotrzebowanie i podaż */
    var dem = [], sup = [], eff = [];
    for (var i = 0; i < N; i++) {
      var day = days[i];
      dem[i] = demandOf(DATA, day); sup[i] = {}; eff[i] = {};
      Object.keys(dem[i]).forEach(function (key) {
        var pr = key.split('|');
        var s = (byRole[pr[0]] || []).filter(function (x) { return x.el[pr[1]] != null && !x.off[day.d]; }).length;
        sup[i][key] = s; eff[i][key] = Math.min(dem[i][key], s);
      });
    }

    /* 2. Pojemność osoby */
    people.forEach(function (x) {
      var open = 0;
      for (var i = 0; i < N; i++) if (days[i].mode !== 'closed' && !x.off[days[i].d]) open++;
      var lim = opts.limitMode === 'historia' ? Math.min(maxMonth, Math.max(1, x.p.hmax)) : maxMonth;
      var src = opts.limitMode === 'historia' && x.p.hmax < maxMonth ? 'historia' : 'limit';
      if (x.dmax != null) { lim = Math.min(maxMonth, x.dmax); src = 'deklaracja'; }
      var streakCap = open - Math.floor(open / (maxStreak + 1));
      x.cap = Math.max(0, Math.min(lim, open, streakCap));
      x.capSrc = x.cap === open && open < lim ? 'dostępność' : src;
    });

    /* 3. Poziom sprawiedliwości (water-filling) */
    var avgDn = {};
    var roleInfo = {};
    Object.keys(byRole).forEach(function (r) {
      var mem = byRole[r]; if (!mem.length) return;
      var D = 0; for (var i = 0; i < N; i++) Object.keys(eff[i]).forEach(function (k) { if (k.split('|')[0] === r) D += eff[i][k]; });
      var dnAvg = mem.reduce(function (s, x) { return s + (x.dn || 0); }, 0) / mem.length || 1;
      avgDn[r] = dnAvg;
      mem.forEach(function (x) { x.w = opts.fair === 'zl' ? dnAvg / Math.max(1, x.dn || dnAvg) : 1; });
      var capSum = mem.reduce(function (s, x) { return s + x.cap; }, 0);
      var L;
      if (capSum <= D) { L = Infinity; mem.forEach(function (x) { x.t = x.cap; }); }
      else {
        var lo = 0, hi = 0; mem.forEach(function (x) { hi = Math.max(hi, x.cap / x.w); });
        for (var it = 0; it < 60; it++) {
          var mid = (lo + hi) / 2, s = 0;
          mem.forEach(function (x) { s += Math.min(x.cap, mid * x.w); });
          if (s > D) hi = mid; else lo = mid;
        }
        L = (lo + hi) / 2; mem.forEach(function (x) { x.t = Math.min(x.cap, L * x.w); });
      }
      mem.forEach(function (x) { x.limited = isFinite(L) && x.cap < L * x.w - 0.01; });
      roleInfo[r] = { D: D, L: L, capSum: capSum, n: mem.length, dnAvg: dnAvg };
    });

    /* 4. Układanie — najpierw najtrudniejsze dni */
    var asg = []; for (var i = 0; i < N; i++) asg[i] = {};
    function runLen(x, i) {
      var l = 0, r = 0, k;
      for (k = i - 1; k >= 0 && x.by[k]; k--) l++;
      for (k = i + 1; k < N && x.by[k]; k++) r++;
      return l + 1 + r;
    }
    function canTake(x, i, loc) {
      var d = days[i];
      if (x.el[loc] == null || x.off[d.d] || x.by[i] || x.a >= x.cap) return false;
      if (runLen(x, i) > maxStreak) return false;
      return true;
    }
    function weAvg(r) { var m = byRole[r]; return m.reduce(function (s, x) { return s + x.we; }, 0) / Math.max(1, m.length); }
    function score(x, i, loc) {
      var wd = days[i].wd, p = x.p;
      var def = (x.t - x.a) / Math.max(1, x.t);
      var hab = p.hab[wd] || 0;
      var pen = (p.obs[wd] >= 4 && hab === 0) ? -1.2 : 0;
      var we = 0;
      if (wd >= 4) { var av = weAvg(x.rola); we = -0.35 * (x.we - av) / Math.max(1, av); }
      var chce = x.want[days[i].d] ? 0.9 : 0;               // pracownik zaznaczył „chcę pracować”
      var lp = x.lpref ? (x.lpref === loc ? 0.6 : -0.6) : 0;  // woli to miejsce
      return 3 * def + 1.6 * x.el[loc] + 1.0 * hab + pen + we + chce + lp + 0.05 * rand();
    }
    function place(x, i, loc) {
      x.by[i] = loc; x.a++; x[loc]++; if (days[i].wd >= 4) x.we++;
      (asg[i][x.rola + '|' + loc] = asg[i][x.rola + '|' + loc] || []).push(x.id);
    }
    function unplace(x, i) {
      var loc = x.by[i]; if (!loc) return;
      delete x.by[i]; x.a--; x[loc]--; if (days[i].wd >= 4) x.we--;
      var arr = asg[i][x.rola + '|' + loc]; arr.splice(arr.indexOf(x.id), 1);
    }
    /* ciepły start: po zmianie deklaracji zostawiamy wszystko, co nadal pasuje — grafik zmienia się punktowo */
    if (opts.prev) {
      for (var pi = 0; pi < N; pi++) {
        people.forEach(function (x) {
          var pl = opts.prev[x.id]; if (!pl) return;
          var loc = pl[pi]; if (loc !== 'F' && loc !== 'R') return;
          var key = x.rola + '|' + loc;
          if (((asg[pi][key] || []).length) >= (eff[pi][key] || 0)) return;
          if (canTake(x, pi, loc)) place(x, pi, loc);
        });
      }
    }
    var jobs = [];
    for (var i = 0; i < N; i++) Object.keys(eff[i]).forEach(function (k) {
      if (eff[i][k] > 0) jobs.push({ i: i, k: k, n: eff[i][k], sc: sup[i][k] / eff[i][k] });
    });
    jobs.sort(function (a, b) { return a.sc - b.sc || b.n - a.n || a.i - b.i; });
    jobs.forEach(function (j) {
      var pr = j.k.split('|'), r = pr[0], loc = pr[1];
      for (var c = (asg[j.i][j.k] || []).length; c < j.n; c++) {
        var best = null, bs = -1e9;
        byRole[r].forEach(function (x) {
          if (!canTake(x, j.i, loc)) return;
          var s = score(x, j.i, loc); if (s > bs) { bs = s; best = x; }
        });
        if (best) place(best, j.i, loc);
      }
    });

    /* 5. Wymiany wyrównujące: przenosimy zmianę od osoby najdalej ponad celem do osoby najdalej pod celem,
          bezpośrednio albo przez trzecią osobę, która zmienia miejsce (F↔R) tego samego dnia. */
    var moves = 0;
    function dev(x) { return x.a - x.t; }
    function tryDirect(xo, xu) {
      var bestI = -1, bestV = -1e9;
      for (var i = 0; i < N; i++) {
        var loc = xo.by[i]; if (!loc || !canTake(xu, i, loc)) continue;
        var v = (xu.p.hab[days[i].wd] || 0) + xu.el[loc] - 0.5 * (xo.p.hab[days[i].wd] || 0) + (xu.want[days[i].d] ? 0.9 : 0) - (xo.want[days[i].d] ? 0.9 : 0);
        if (v > bestV) { bestV = v; bestI = i; }
      }
      if (bestI < 0) return false;
      var l = xo.by[bestI]; unplace(xo, bestI); place(xu, bestI, l); return true;
    }
    function tryChain(xo, xu, mem) {
      for (var i = 0; i < N; i++) {
        var l1 = xo.by[i]; if (!l1) continue;
        var l2 = l1 === 'F' ? 'R' : 'F';
        if (xu.el[l2] == null || xu.off[days[i].d] || xu.by[i] || xu.a >= xu.cap || runLen(xu, i) > maxStreak) continue;
        for (var q = 0; q < mem.length; q++) {
          var k = mem[q];
          if (k === xo || k === xu || k.by[i] !== l2 || k.el[l1] == null) continue;
          unplace(xo, i); unplace(k, i); place(k, i, l1); place(xu, i, l2); return true;
        }
      }
      return false;
    }
    Object.keys(byRole).forEach(function (r) {
      var mem = byRole[r];
      for (var guard = 0; guard < 3000; guard++) {
        var srt = mem.slice().sort(function (a, b) { return dev(b) - dev(a); });
        var done = false;
        for (var oi = 0; oi < srt.length && !done; oi++) {
          var xo = srt[oi]; if (xo.a === 0) continue;
          for (var ui = srt.length - 1; ui > oi && !done; ui--) {
            var xu = srt[ui];
            if (dev(xo) - dev(xu) <= 1.0001 || xu.a >= xu.cap) continue;
            if (tryDirect(xo, xu) || tryChain(xo, xu, mem)) { moves++; done = true; }
          }
          if (dev(xo) <= 0.5) break;
        }
        if (!done) break;
      }
    });
    // dopełnij luki (np. po wymianach zwolniła się pojemność)
    jobs.forEach(function (j) {
      var pr = j.k.split('|'), r = pr[0], loc = pr[1];
      var have = (asg[j.i][j.k] || []).length;
      for (var c = have; c < j.n; c++) {
        var best = null, bs = -1e9;
        byRole[r].forEach(function (x) { if (!canTake(x, j.i, loc)) return; var s = score(x, j.i, loc); if (s > bs) { bs = s; best = x; } });
        if (best) place(best, j.i, loc); else break;
      }
    });

    /* 6. Łatanie luk osobami z dodatkową rolą (kompetencje z karty Załogi): najpierw ci najdalej od swojego poziomu */
    var altCount = 0;
    for (var ai = 0; ai < N; ai++) {
      Object.keys(dem[ai]).forEach(function (k) {
        var pr = k.split('|'), r = pr[0], loc = pr[1], dd = days[ai];
        for (var c = (asg[ai][k] || []).length; c < dem[ai][k]; c++) {
          var best = null, bs = -1e9;
          people.forEach(function (x) {
            if (x.rola === r || x.dod.indexOf(r) < 0 || !x.locs[loc]) return;
            if (x.off[dd.d] || x.by[ai] || x.a >= x.cap || runLen(x, ai) > maxStreak) return;
            var s = -(x.a / Math.max(1, x.t)) + 0.5 * (x.p.hab[dd.wd] || 0) + 0.02 * rand() - (x.rola === 'Zarząd' ? 3 : 0); // zarząd na końcu kolejki
            if (s > bs) { bs = s; best = x; }
          });
          if (!best) break;
          best.by[ai] = loc; best.a++; best[loc]++; if (dd.wd >= 4) best.we++; best.alt[ai] = r;
          (asg[ai][k] = asg[ai][k] || []).push(best.id); altCount++;
        }
      });
    }

    /* 6b. Dyżur Social Media: zadanie dodatkowe na zmianie — rotacyjnie wśród pracujących tego dnia osób z tą rolą */
    var smGaps = [], smOkN = people.filter(function (x) { return x.smOk; }).length;
    if (opts.smDaily > 0 && smOkN) {
      for (var si = 0; si < N; si++) {
        if (days[si].mode === 'closed') continue;
        for (var sc = 0; sc < opts.smDaily; sc++) {
          var bestS = null, bsS = -1e9;
          people.forEach(function (x) {
            if (!x.smOk || !x.by[si] || x.sm[si]) return;
            var sv = -x.smN + (x.by[si] === 'F' ? 0.3 : 0) + 0.05 * rand();
            if (sv > bsS) { bsS = sv; bestS = x; }
          });
          if (bestS) { bestS.sm[si] = true; bestS.smN++; } else { smGaps.push(days[si].d); break; }
        }
      }
    }

    /* 7. Wyniki */
    var perDay = [], gaps = [], totalCost = 0, totalShifts = 0;
    for (var i = 0; i < N; i++) {
      var rec = { d: days[i].d, wd: days[i].wd, mode: days[i].mode, dem: dem[i], eff: eff[i], asg: {}, gap: {}, F: 0, R: 0, cost: 0, need: 0, have: 0 };
      Object.keys(dem[i]).forEach(function (k) {
        var have = (asg[i][k] || []).length, need = dem[i][k];
        rec.asg[k] = have; rec.need += need; rec.have += have;
        if (have < need) { rec.gap[k] = need - have; gaps.push({ d: days[i].d, k: k, n: need - have, structural: eff[i][k] < need }); }
        rec[k.split('|')[1]] += have;
      });
      perDay.push(rec);
    }
    var persons = people.map(function (x) {
      var pay = 0;
      for (var pi2 = 0; pi2 < N; pi2++) {
        if (x.by[pi2]) pay += x.alt[pi2] && x.rates[x.alt[pi2]] != null ? x.rates[x.alt[pi2]] : (x.dn || 0);
        if (x.sm[pi2]) pay += x.smRate;
      }
      totalCost += pay; totalShifts += x.a;
      var plan = []; for (var i = 0; i < N; i++) plan.push(x.by[i] || (days[i].mode === 'closed' ? '#' : (x.off[days[i].d] ? 'x' : '')));
      perDay.forEach(function (rd, i) { if (x.by[i]) rd.cost += x.alt[i] && x.rates[x.alt[i]] != null ? x.rates[x.alt[i]] : (x.dn || 0); if (x.sm[i]) rd.cost += x.smRate; });
      return { id: x.id, rola: x.rola, a: x.a, t: x.t, cap: x.cap, capSrc: x.capSrc, limited: x.limited, we: x.we, F: x.F, R: x.R,
        pay: pay, hours: x.a * (x.p.godz || 12), plan: plan, el: x.el, alt: x.alt, locs: x.locs, dn: x.dn, rates: x.rates, sm: x.sm, smN: x.smN, smRate: x.smRate };
    });
    var roles = {};
    Object.keys(roleInfo).forEach(function (r) {
      var mem = persons.filter(function (x) { return x.rola === r; });
      var free = mem.filter(function (x) { return !x.limited; });
      var pays = mem.map(function (x) { return x.pay; }), shifts = mem.map(function (x) { return x.a; });
      roles[r] = Object.assign({}, roleInfo[r], {
        gini: gini(opts.fair === 'zl' ? free.map(function (x) { return x.pay; }) : free.map(function (x) { return x.a; })),
        giniPay: gini(pays),
        minA: Math.min.apply(null, shifts), maxA: Math.max.apply(null, shifts),
        minFreeA: free.length ? Math.min.apply(null, free.map(function (x) { return x.a; })) : null,
        maxFreeA: free.length ? Math.max.apply(null, free.map(function (x) { return x.a; })) : null,
        minPay: Math.min.apply(null, pays), maxPay: Math.max.apply(null, pays),
        assigned: shifts.reduce(function (a, b) { return a + b; }, 0)
      });
    });
    return { perDay: perDay, persons: persons, roles: roles, gaps: gaps, moves: moves, altCount: altCount, smGaps: smGaps, smOkN: smOkN, totalCost: totalCost, totalShifts: totalShifts };
  }

<script>

function statMies(k) {
  const M = mies(k), dni = [];
  for (let d = 0; d < M.dni; d++) dni.push({ F: 0, R: 0, U: 0, koszt: 0, h: 0 });
  let osobodni = 0, godz = 0, koszt = 0;
  DATA.people.forEach(p => {
    p.m[k].d.forEach((c, i) => { if (!c) return; const t = c[0] === '?' ? 'U' : c[0]; dni[i][t]++; dni[i].koszt += c[2] || 0; dni[i].h += c[1] || 0; osobodni++; godz += c[1] || 0; koszt += c[2] || 0; });
  });
  return { dni, osobodni, godz, koszt };
}

function tsv() {
  const r = R(); const head = ['Nazwisko', 'Imię', 'Rola']; for (let d = 1; d <= 31; d++) head.push(String(d)); head.push('Zmiany', 'Podstawa (zł)');

}

let toastT = 0;
function toast(poza, html) {
  $('#toast').innerHTML = `<div class="toast" role="status"><img src="${IMG[poza] || IMG.ok}" alt="" width="38"><span>${html}</span></div>`;
  clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').innerHTML = ''; }, /<button/.test(html) ? 9000 : 4200);
}
const tip = $('#tip');
function pokazTip(el) {
  const t = el.getAttribute('data-tip'); if (!t) return;
  const [a, ...b] = t.split('|');
  tip.textContent = '';
  const s = document.createElement('b'); s.textContent = a; tip.appendChild(s);
  b.forEach(line => { tip.appendChild(document.createElement('br')); tip.appendChild(document.createTextNode(line)); });
  const r = el.getBoundingClientRect();
  tip.classList.add('wid');
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;
  if (y < 8) y = r.bottom + 8;
  x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function ukryjTip() { tip.classList.remove('wid'); }
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el) pokazTip(el); else ukryjTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) pokazTip(el); });
document.addEventListener('focusout', ukryjTip);
document.addEventListener('scroll', ukryjTip, true);

function kartaWniosku(w) {

  let info = '';
  const gr = dni.filter(iso => iso.startsWith('2026-12-')).map(iso => +iso.slice(8));
  if (gr.length) {
    const x = osobaPlan(w.osoba);
    if (w.stan === 'przyjety') info += `<div class="info">W grafiku grudnia: ${gr.length} ${odm(gr.length, 'dzień', 'dni', 'dni')} jako ${w.typ === 'urlop' ? 'urlop' : 'chorobowe'} — zmiany przejęły inne osoby.</div>`;

      info += `<div class="info">${kol.length ? `W projekcie grudnia ma wtedy <b>${kol.length} ${odm(kol.length, 'zmianę', 'zmiany', 'zmian')}</b> (${kol.join(', ')}.12). Po przyjęciu ZDZISŁAW przekaże je innym, pilnując poziomu w roli.` : 'W projekcie grudnia nie ma w tych dniach zmian.'}</div>`;
    }
  }
  if (w.typ === 'choroba' && w.stan === 'nowy' && dni.some(iso => iso.startsWith('2026-11-'))) {
    const k = kandydaci(w.osoba);
    info += `<div class="info">Kto może zastąpić (${esc(ROLE_N[p.rola].toLowerCase())}, ${MIEJSCE[glowneMiejsce(p)]}, najmniej dni w listopadzie): ${k.length ? k.map(c => `<b>${esc(pelne(c.q))}</b> (${c.nov} ${odm(c.nov, 'dzień', 'dni', 'dni')})`).join(', ') : 'brak osób tej roli'}.</div>`;

  if (w.typ === 'pozyczka') {

    const rata = planRat(l)[0] ? planRat(l)[0].kwota : 0, sr = srPodstawa(p), sal = saldoOsoby(w.osoba);
    info += `<div class="info">${[sr ? `Rata to ok. <b>${Math.round(rata / sr * 100)}%</b> średniej podstawy (${zl(sr)}, wrzesień–październik)` : '', sal ? `ma już pożyczkę: saldo <b>${zl(sal)}</b>` : 'bez innych pożyczek', w.stan === 'nowy' ? 'raty od wypłaty za listopad' : ''].filter(Boolean).join(' · ')}.</div>`;
  }
  let limZ = null, ponadZ = false;

/* koszt pracy z obecności: dniówki wg miejsca (F, R, nieznane), dodatki, bonusy (z umorzonymi zaliczkami) */
function kosztMies(k) {
  const o = { F: 0, R: 0, U: 0, osd: 0, dod: 0, bon: 0 };
  const doD = k === MIES_ROZL && SPRZ.mies[k] && SPRZ.mies[k].do ? +SPRZ.mies[k].do.slice(8) : 99;   // listopad: tylko dni, dla których jest sprzedaż

/* udział dniówek w sprzedaży wg dnia tygodnia — 23.09–4.11 (miejsce znane), bez 1.11 */
function tydzienUdzial() {
  const lab = {};
  DATA.people.forEach(p => MIES_K3.forEach(([k]) => { const m = p.m[k]; if (!m) return; m.d.forEach((c, i) => { if (!c || (c[0] !== 'F' && c[0] !== 'R')) return; const iso = `${k}-${pad2(i + 1)}`; const l = lab[iso] = lab[iso] || { F: 0, R: 0 }; l[c[0]] += c[2] || 0; }); }));
  const acc = Array.from({ length: 7 }, () => ({ lF: 0, lR: 0, sF: 0, sR: 0, n: 0 }));
  Object.keys(SPRZ.dni).forEach(iso => {
    if (iso < '2026-09-23' || iso > '2026-11-04' || iso === '2026-11-01') return;
    const w = (new Date(iso + 'T12:00:00').getDay() + 6) % 7, l = lab[iso] || { F: 0, R: 0 }, a = acc[w], s = SPRZ.dni[iso];
    a.lF += l.F; a.lR += l.R; a.sF += s[0]; a.sR += s[1]; a.n++;
  });
  const sum = acc.reduce((t2, a) => ({ l: t2.l + a.lF + a.lR, s: t2.s + a.sF + a.sR }), { l: 0, s: 0 });
  return {
    dni: acc.map(a => ({ F: a.sF ? a.lF / a.sF : 0, R: a.sR ? a.lR / a.sR : 0, razem: a.sF + a.sR ? (a.lF + a.lR) / (a.sF + a.sR) : 0, sprz: (a.sF + a.sR) / Math.max(1, a.n), praca: (a.lF + a.lR) / Math.max(1, a.n), n: a.n })),
    sr: sum.s ? sum.l / sum.s : 0

}
function wykresTygodnia(td) {
  const t = td.dni, W = 640, H = 236, L = 40, Rm = 74, T = 18, B = 30, iw = W - L - Rm, ih = H - T - B;
  const top = Math.max(0.1, Math.ceil((Math.max(...t.map(x => Math.max(x.F, x.R)), td.sr) + 0.02) * 10) / 10);
  const y = v => T + ih - (v / top) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Udział dniówek w sprzedaży według dnia tygodnia: Fabryka i Restauracja, średnio ${Math.round(td.sr * 100)}%">`;

    doc.setProperties(Object.assign({ creator: 'team.dysza.app', author: 'Pracownia Sushi' }, meta || {}));
    doc.setLanguage('pl');
    doc.setLineJoin('round');
    return doc;
  }

  /* ── pomocnicze ── */
  function ust(doc, o) { doc.setFont(o.r || 'Inter', o.f || 'normal'); doc.setFontSize(o.pt || 8); doc.setTextColor(o.kol || K.tekst); doc.setCharSpace(o.cs || 0); }
  function szer(doc, s, o) { ust(doc, o); const t = String(s); doc.setCharSpace(0); return doc.getTextWidth(t) + (o.cs || 0) * Math.max(0, t.length - 1); }
  function tx(doc, s, x, y, o) {                                       // o.w: 'l' | 'r' | 'c'
    o = o || {}; const t = String(s); if (!t) return 0;
    const w = szer(doc, t, o), x0 = o.w === 'r' ? x - w : o.w === 'c' ? x - w / 2 : x;
    ust(doc, o); doc.text(t, x0, y, o.kat ? { angle: o.kat } : undefined); doc.setCharSpace(0);
    return w;
  }
  function dopasuj(doc, s, o, maxW, minPt) {                          // zmniejsz do minPt, potem skróć „…”
    let pt = o.pt; while (pt > minPt && szer(doc, s, Object.assign({}, o, { pt })) > maxW) pt -= 0.25;
    const o2 = Object.assign({}, o, { pt }); let t = String(s);
    if (szer(doc, t, o2) > maxW) { while (t.length > 1 && szer(doc, t + '…', o2) > maxW) t = t.slice(0, -1); t = t.replace(/\s+$/, '') + '…'; }
    return { t, o: o2 };
  }
  function liczba(v) { const n = Math.round(Math.abs(v || 0)); return (v < 0 && n ? MINUS : '') + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
  const kwota = v => liczba(v) + NB + 'zł';
  const cyr = s => /[Ѐ-ӿ]/.test(s);                          // Bebas nie ma cyrylicy — wtedy Inter
  function linia(doc, x1, y1, x2, y2, kol, gr, kres) {
    doc.setDrawColor(kol); doc.setLineWidth(gr);
    if (kres) doc.setLineDashPattern(kres, 0);
    doc.line(x1, y1, x2, y2);
    if (kres) doc.setLineDashPattern([], 0);
  }
  function prost(doc, x, y, w, h, kol, r) { doc.setFillColor(kol); if (r) doc.roundedRect(x, y, w, h, r, r, 'F'); else doc.rect(x, y, w, h, 'F'); }
  function ramka(doc, x, y, w, h, kol, gr, r) { doc.setDrawColor(kol); doc.setLineWidth(gr); doc.roundedRect(x, y, w, h, r, r, 'S'); }
  const odm = (n, a, b, c) => n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c;
  const odmUA = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11) ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c;

  /* plakietka zmiany — jak w aplikacji: F zieleń, R pomarańcz; kropka = inna rola (prawy róg), kwadracik = dyżur Social Media (lewy róg) */
  function plakietka(doc, x, y, w, h, c, o) {
    prost(doc, x, y, w, h, K[c], Math.min(0.75, h / 3));
    tx(doc, c, x + w / 2, y + h / 2 + o.pt * PT * 0.36, { f: 'bold', pt: o.pt, kol: K[c + 'tx'], w: 'c' });
    const r = Math.max(0.42, Math.min(0.62, h / 4.6));
    if (o.alt) { doc.setFillColor(K.bialy); doc.circle(x + w - r - 0.55, y + h / 2, r + 0.28, 'F'); doc.setFillColor(K.alt); doc.circle(x + w - r - 0.55, y + h / 2, r, 'F'); }
    if (o.sm) { const a = r * 1.75; prost(doc, x + 0.55 - 0.28, y + h / 2 - a / 2 - 0.28, a + 0.56, a + 0.56, K.bialy, 0.3); prost(doc, x + 0.55, y + h / 2 - a / 2, a, a, K.sm, 0.18); }
  }

  /* ═════════ 1. Grafik opublikowany — A3 poziomo ═════════ */
  function grafik(d) {
    const doc = nowy({ orientation: 'landscape', format: 'a3' }, { title: `Harmonogram · ${d.miesiac}`, subject: 'Grafik zespołu — wersja opublikowana' });
    const W = 420, H = 297, M = 12, N = d.dni;
    // nagłówek
    tx(doc, 'HARMONOGRAM · PRACOWNIA SUSHI', M, 16, { f: 'semibold', pt: 8, kol: K.tekst3, cs: 0.35 });
    tx(doc, d.miesiac.toUpperCase(), M - 0.4, 31.5, { r: 'Bebas', pt: 44 });
    tx(doc, `Opublikowany ${d.opublikowany} · wariant ${d.wariant} · ${d.osob} ${odm(d.osob, 'osoba', 'osoby', 'osób')}`, W - M, 16, { pt: 9, kol: K.tekst2, w: 'r' });
    // legenda — jedna linia, wyrównana do prawej
    const lb = 7, lh = 3.5, ly = 27.6, lpt = 6.6;
    const leg = [[(x, y) => plakietka(doc, x, y, lb, lh, 'F', { pt: lpt }), 'Fabryka'], [(x, y) => plakietka(doc, x, y, lb, lh, 'R', { pt: lpt }), 'Restauracja']];
    if (d.zAlt) leg.push([(x, y) => plakietka(doc, x, y, lb, lh, 'F', { pt: lpt, alt: 1 }), 'w innej roli']);
    if (d.zSM) leg.push([(x, y) => plakietka(doc, x, y, lb, lh, 'F', { pt: lpt, sm: 1 }), 'dyżur Social Media']);
    if (d.zamk.length) leg.push([(x, y) => prost(doc, x, y, lb, lh, K.zamk, 0.6), 'zamknięte']);
    const lo = { pt: 8, kol: K.tekst2 }, odst = 6;
    const lw = leg.reduce((a, [, t]) => a + lb + 1.8 + szer(doc, t, lo), 0) + odst * (leg.length - 1);
    let lx = W - M - lw;
    leg.forEach(([rys, t]) => { rys(lx, ly); lx += lb + 1.8; lx += tx(doc, t, lx, ly + lh / 2 + 8 * PT * 0.36, lo) + odst; });

    // siatka
    const nazW = 52, sumW = 12, dW = (W - 2 * M - nazW - sumW) / N;
    const g0 = 38, hH = 8.6;
    const wierszy = d.grupy.reduce((a, gr) => a + 1 + gr.osoby.length, 0) + 2;
    const h = Math.min(5.2, (H - 16 - (g0 + hH)) / wierszy);
    const yKon = g0 + hH + wierszy * h;
    const xd = i => M + nazW + i * dW;
    const pt = Math.max(5.2, Math.min(7.6, h * 1.78)), bh = h - 0.7, bw = dW - 1.1;
    const kap = pt * PT * 0.36;
    // tło: weekendy i dni zamknięte
    for (let i = 0; i < N; i++) {
      const wd = (d.wd0 + i) % 7;
      if (d.zamk.includes(i + 1)) prost(doc, xd(i), g0, dW, yKon - g0, K.zamk);
      else if (wd >= 5) prost(doc, xd(i), g0, dW, yKon - g0, K.weekend);
    }
    // nagłówek dni
    const WDN = ['PN', 'WT', 'ŚR', 'CZ', 'PT', 'SB', 'ND'];
    tx(doc, 'OSOBA', M + 1.2, g0 + 5.6, { f: 'semibold', pt: 6.5, kol: K.tekst3, cs: 0.3 });
    tx(doc, 'ZMIAN', W - M - 1, g0 + 5.6, { f: 'semibold', pt: 6.5, kol: K.tekst3, cs: 0.3, w: 'r' });
    for (let i = 0; i < N; i++) {
      const cx = xd(i) + dW / 2, wd = (d.wd0 + i) % 7;
      tx(doc, String(i + 1), cx, g0 + 4.3, { f: 'semibold', pt: 8.5, kol: wd >= 5 ? K.tekst2 : K.tekst, w: 'c' });
      tx(doc, WDN[wd], cx, g0 + 7.4, { pt: 5.6, kol: K.tekst3, w: 'c', cs: 0.15 });
    }
    linia(doc, M, g0 + hH, W - M, g0 + hH, K.tekst, 0.3);
    // wiersze
    let y = g0 + hH;
    const sumy = { F: Array(N).fill(0), R: Array(N).fill(0) };
    d.grupy.forEach(gr => {
      prost(doc, M, y, W - 2 * M, h, K.pow3);
      const gw = tx(doc, gr.nazwa, M + 1.2, y + h / 2 + kap, { f: 'semibold', pt, kol: K.tekst });
      tx(doc, ` · ${gr.osoby.length}`, M + 1.2 + gw, y + h / 2 + kap, { pt, kol: K.tekst3 });
      y += h;
      gr.osoby.forEach(o => {
        const by = y + h / 2 + kap;
        const im = dopasuj(doc, o.imie + ' ' + o.nazwisko, { f: 'semibold', pt }, nazW - 3, pt - 1.2);
        // imię półgrube, nazwisko zwykłe — w jednej linii
        const sp = im.t.indexOf(' ');
        if (sp > 0 && im.t.slice(0, sp) === o.imie) { const wi = tx(doc, o.imie + ' ', M + 1.2, by, im.o); tx(doc, im.t.slice(sp + 1), M + 1.2 + wi, by, Object.assign({}, im.o, { f: 'normal' })); }
        else tx(doc, im.t, M + 1.2, by, im.o);
        let n = 0;
        for (let i = 0; i < N; i++) {
          const c = o.plan[i];
          if (c !== 'F' && c !== 'R') continue;
          n++; sumy[c][i]++;
          plakietka(doc, xd(i) + (dW - bw) / 2, y + (h - bh) / 2, bw, bh, c, { pt: pt - 0.3, alt: o.alt && o.alt[i], sm: o.sm && o.sm.includes(i) });
        }
        tx(doc, String(n), W - M - 1, by, { f: 'semibold', pt, w: 'r' });
        linia(doc, M, y + h, W - M, y + h, K.linia, 0.12);
        y += h;
      });
    });
    // obsada dnia
    linia(doc, M, y, W - M, y, K.tekst, 0.3);
    [['F', 'Fabryka · osób'], ['R', 'Restauracja · osób']].forEach(([c, opis]) => {
      const by = y + h / 2 + kap;
      tx(doc, opis, M + 1.2, by, { f: 'semibold', pt, kol: K.tekst2 });
      for (let i = 0; i < N; i++) if (sumy[c][i]) tx(doc, String(sumy[c][i]), xd(i) + dW / 2, by, { f: 'semibold', pt, kol: c === 'F' ? K.F : K.Rliczba, w: 'c' });
      tx(doc, String(sumy[c].reduce((a, b) => a + b, 0)), W - M - 1, by, { f: 'semibold', pt, kol: K.tekst2, w: 'r' });
      y += h;
    });
    // dni zamknięte — jednolity pas od nagłówka do dołu (przykrywa pasy grup i linie), jeden podpis na blok
    const bloki = []; d.zamk.slice().sort((a, b) => a - b).forEach(dz => { const b = bloki[bloki.length - 1]; if (b && b[1] === dz - 1) b[1] = dz; else bloki.push([dz, dz]); });
    bloki.forEach(([a, b]) => {
      const x0 = xd(a - 1), x1 = xd(b), cx = (x0 + x1) / 2, cy = g0 + hH + (yKon - g0 - hH) / 2;
      prost(doc, x0, g0 + hH + 0.15, x1 - x0, yKon - g0 - hH - 0.15, K.zamk);
      const t1 = 'ZAMKNIĘTE', t2 = a === b ? `${a}.${d.mies2}` : `${a}–${b}.${d.mies2}`;
      if (x1 - x0 >= 22) {
        tx(doc, t1, cx, cy - 0.6, { f: 'semibold', pt: 7.5, kol: K.tekst2, cs: 0.6, w: 'c' });
        tx(doc, t2, cx, cy + 3.4, { pt: 7, kol: K.tekst3, w: 'c' });
      } else {
        const w = szer(doc, t1, { f: 'semibold', pt: 7, cs: 0.6 });
        tx(doc, t1, cx + 7 * PT * 0.36, cy + w / 2, { f: 'semibold', pt: 7, kol: K.tekst2, cs: 0.6, kat: 90 });
      }
    });
    // linie tygodni (po niedzieli)
    for (let i = 0; i < N - 1; i++) if ((d.wd0 + i) % 7 === 6) linia(doc, xd(i + 1), g0, xd(i + 1), yKon, K.ramka, 0.3);
    // stopka
    tx(doc, 'team.dysza.app · zmiany w grafiku tylko przez HR', M, H - 7, { pt: 7, kol: K.tekst3 });
    tx(doc, `Wydrukowano ${d.teraz}${d.kto ? ' · ' + d.kto : ''}`, W - M, H - 7, { pt: 7, kol: K.tekst3, w: 'r' });
    return doc;
  }

  /* ═════════ 2. Wypłaty — zestawienie zbiorcze, A4 pionowo (tylko HR) ═════════ */
  const KOLUMNY = {
    dni: ['DNI', 7.5], godz: ['GODZ.', 10], podstawa: ['PODSTAWA', 15], bonus: ['BONUS', 12.5], dodatek: ['DODATEK', 13.5], potracenie: ['POTRĄCENIE', 16],
    rt: ['RATA', 11], przen: ['MINUS', 11.5], wyplacic: ['WYPŁACIĆ', 14.5], naKonto: ['NA KONTO', 14.5], gotowka: ['GOTÓWKĄ', 14], pozostaje: ['POZOSTAJE', 15.5], koperta: ['W KOPERCIE', 16.5]
  };
  function zbiorczy(d) {
    const doc = nowy({ orientation: 'portrait', format: 'a4' }, { title: `Wypłaty · ${d.miesiac} · zestawienie zbiorcze`, subject: 'Poufne — tylko dla HR' });
    const W = 210, H = 297, M = 12, DOL = H - 18;
    const kol = ['dni', 'godz', 'podstawa', 'bonus', 'dodatek', 'potracenie', ...(d.zRat ? ['rt'] : []), ...(d.zPrz ? ['przen'] : []), 'wyplacic', 'naKonto', 'gotowka', 'pozostaje', 'koperta'];
    const skala = Math.min(1, (W - 2 * M - 34) / kol.reduce((a, k) => a + KOLUMNY[k][1], 0));
    const kw = kol.map(k => KOLUMNY[k][1] * skala), nazW = W - 2 * M - kw.reduce((a, b) => a + b, 0);
    const pt = skala < 0.985 ? 6.7 : 7.2, kap = pt * PT * 0.36;
    const gl = { pt: skala < 0.985 ? 5.1 : 5.5, cs: 0.1 };              // nagłówki kolumn: zawsze z odstępem od sąsiada
    const naglowek = ciag => {
      tx(doc, 'WYPŁATY · ZESTAWIENIE ZBIORCZE', M, 16, { f: 'semibold', pt: 7.5, kol: K.tekst3, cs: 0.35 });
      tx(doc, 'POUFNE · TYLKO DLA HR', W - M, 16, { f: 'bold', pt: 7.5, kol: K.czerw, cs: 0.35, w: 'r' });
      if (ciag) { tx(doc, d.miesiac.toUpperCase() + ' · CIĄG DALSZY', M - 0.2, 25, { r: 'Bebas', pt: 18 }); return 30; }
      tx(doc, d.miesiac.toUpperCase(), M - 0.3, 30.5, { r: 'Bebas', pt: 36 });
      tx(doc, d.podtytul, M, 36.6, { pt: 8, kol: d.wtoku ? K.czerw : K.tekst2 });
      return 41;
    };
    const glowka = y => {
      tx(doc, 'OSOBA', M + 1, y + 4.6, { f: 'semibold', pt: gl.pt, kol: K.tekst3, cs: gl.cs });
      let x = M + nazW;
      kol.forEach((k, j) => { x += kw[j]; tx(doc, KOLUMNY[k][0], x - 1, y + 4.6, { f: k === 'koperta' ? 'bold' : 'semibold', pt: gl.pt, kol: k === 'koperta' ? K.tekst : K.tekst3, cs: gl.cs, w: 'r' }); });
      linia(doc, M, y + 6.6, W - M, y + 6.6, K.tekst, 0.3);
      return y + 6.6;
    };
    const nowaStrona = () => { doc.addPage('a4', 'portrait'); y = glowka(naglowek(true)); };
    let y = naglowek(false);
    // kafle
    const gap = 4, kwid = (W - 2 * M - 3 * gap) / 4;
    d.kafle.forEach((k, i) => {
      const x = M + i * (kwid + gap);
      ramka(doc, x, y, kwid, 19.5, k.mocny ? K.tekst : K.ramka, k.mocny ? 0.4 : 0.25, 2);
      tx(doc, k.e, x + 3.5, y + 5.6, { f: 'semibold', pt: 6, kol: K.tekst3, cs: 0.3 });
      tx(doc, k.w, x + 3.5, y + 12.6, { f: 'bold', pt: 13.5 });
      const p = dopasuj(doc, k.p, { pt: 6.5, kol: K.tekst2 }, kwid - 7, 5.6); tx(doc, p.t, x + 3.5, y + 16.8, p.o);
    });
    y += 26;
    y = glowka(y);
    const HW = { osoba: 4.75, grupa: 5.3, razem: 6.4 };
    const wiersz = (r, typ) => {
      const hh = HW[typ];
      if (y + hh > DOL) nowaStrona();
      if (typ === 'grupa') prost(doc, M, y, W - 2 * M, hh, K.pow3);
      const f = typ === 'osoba' ? 'normal' : typ === 'grupa' ? 'semibold' : 'bold', by = y + hh / 2 + kap;
      if (typ === 'osoba') {
        const im = dopasuj(doc, r.imie + ' ' + r.nazwisko, { f: 'semibold', pt }, nazW - 3, pt - 1);
        const sp = im.t.indexOf(' ');
        if (sp > 0 && im.t.slice(0, sp) === r.imie) { const wi = tx(doc, r.imie + ' ', M + 1, by, im.o); tx(doc, im.t.slice(sp + 1), M + 1 + wi, by, Object.assign({}, im.o, { f: 'normal' })); }
        else tx(doc, im.t, M + 1, by, im.o);
      } else tx(doc, r.nazwa, M + 1, by, { f, pt, kol: K.tekst });
      let x = M + nazW;
      kol.forEach((k, j) => {
        x += kw[j];
        if ((k === 'dni' || k === 'godz') && typ !== 'osoba') return;
        let v = r[k]; if (k === 'rt' && v) v = -v;
        const zero = !Math.round(v || 0);
        tx(doc, zero ? '—' : liczba(v), x - 1, by, { f: k === 'koperta' ? (typ === 'osoba' ? 'semibold' : 'bold') : f, pt, kol: zero ? K.tekst3 : v < 0 ? K.czerw : K.tekst, w: 'r' });
      });
      if (typ === 'osoba') linia(doc, M, y + hh, W - M, y + hh, K.linia, 0.12);
      y += hh;
    };
    d.grupy.forEach(gr => {
      if (y + HW.grupa + HW.osoba > DOL) nowaStrona();                 // nagłówek grupy nie zostaje sam na dole strony
      wiersz(Object.assign({ nazwa: `${gr.nazwa} · ${gr.wiersze.length}` }, gr.suma), 'grupa');
      gr.wiersze.forEach(r => wiersz(r, 'osoba'));
    });
    if (y + HW.razem + 1 > DOL) nowaStrona();
    linia(doc, M, y, W - M, y, K.tekst, 0.45);
    wiersz(Object.assign({ nazwa: 'Razem' }, d.razem), 'razem');
    const n = doc.getNumberOfPages();
    for (let s = 1; s <= n; s++) {
      doc.setPage(s);
      linia(doc, M, H - 12.5, W - M, H - 12.5, K.linia, 0.2);
      tx(doc, `Poufne · tylko dla HR · wydrukowano ${d.teraz}${d.kto ? ' · ' + d.kto : ''}`, M, H - 8, { pt: 6.8, kol: K.tekst3 });
      tx(doc, `strona ${s} z ${n}`, W - M, H - 8, { pt: 6.8, kol: K.tekst3, w: 'r' });
    }
    return doc;
  }

  /* ═════════ 3. Wydruk załogi — 4 osoby na A4 (do kopert), linie cięcia ═════════ */
  const TL = {   // te same słowa co w widoku „Zarobki” pracownika
    pl: { firma: 'PRACOWNIA SUSHI · WYPŁATA', podstawa: 'Podstawa (suma dniówek)', bonus: 'Bonus', dodatek: 'Dodatek', potracenie: 'Potrącenie', rata: 'Rata pożyczki',
      przen: 'Minus z poprzedniego miesiąca', dowyp: 'Do wypłaty', nakonto: 'Na konto', wtym: 'w tym zaliczki', koperta: 'W KOPERCIE', godz: 'godz.', wtoku: 'W TOKU · STAN NA',
      dni: n => `${n} ${odm(n, 'dzień', 'dni', 'dni')}`, calosc: 'Całość na konto.', minus: k => `Minus ${k} przechodzi na następny miesiąc.`, stopka: 'Dzień po dniu: team.dysza.app → Zarobki' },
    ua: { firma: 'PRACOWNIA SUSHI · ВИПЛАТА', podstawa: 'Основа (сума денних ставок)', bonus: 'Бонус', dodatek: 'Доплата', potracenie: 'Утримання', rata: 'Внесок за позику',
      przen: 'Мінус з попереднього місяця', dowyp: 'До виплати', nakonto: 'На рахунок', wtym: 'у т. ч. аванси', koperta: 'У КОНВЕРТІ', godz: 'год', wtoku: 'ТРИВАЄ · СТАН НА',
      dni: n => `${n} ${odmUA(n, 'день', 'дні', 'днів')}`, calosc: 'Уся сума — на рахунок.', minus: k => `Мінус ${k} переходить на наступний місяць.`, stopka: 'По днях: team.dysza.app → Заробіток' }
  };
  function nozyczki(doc, cx, cy, kat) {                                // nożyczki na linii cięcia (rysunek wektorowy)
    const a = kat * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const P = (x, y) => [cx + x * c - y * s, cy + x * s + y * c];
    const pion = Math.abs(s) > 0.5;
    prost(doc, cx - (pion ? 2.6 : 4.2), cy - (pion ? 4.2 : 2.6), pion ? 5.2 : 8.4, pion ? 8.4 : 5.2, K.bialy);
    doc.setDrawColor(K.tekst2); doc.setFillColor(K.tekst2); doc.setLineWidth(0.3);
    [-1, 1].forEach(u => {
      const rx = -2.3, ry = 0.95 * u, rr = 0.82;                       // pierścień
      const dl = Math.hypot(rx, ry), dx = -rx / dl, dy = -ry / dl;     // kierunek od pierścienia przez oś

  drukZbiorczy: el => drukWyplat(el, 'zbiorczy'),

});

/* ───────── dane z bazy ───────── */
function przeliczListopad() {                                // arkusz Z (dni z kwotą) + raporty dnia (dni bez kwoty, liczone ze stawek z Załogi)
  const K = MIES_ROZL, N = 30;
  let max = 0, zmax = 0;
  DATA.people.forEach(p => {
    const z = p.mZ; if (!z) return;
    const d = Array.from({ length: N }, (_, i) => (z.d[i] ? z.d[i].slice(0, 3) : 0));
    const ob = OB[p.id] || {};
    for (let i = 0; i < N; i++) {
      const iso = `${K}-${pad2(i + 1)}`, zx = d[i], rx = ob[iso];
      if (zx && zx[2] > 0) { zmax = Math.max(zmax, i + 1); continue; }
      if (rx) d[i] = [rx.lok, rx.godz, kwotaDnia(p, rx.rola || p.rola, iso, rx.godz), 1];
      else if (zx) d[i] = [zx[0], zx[1], kwotaDnia(p, p.rola, iso, zx[1]), 1];
    }
    const kor = (S.obKor || {})[p.id] || {};               // poprawki HR: ostatnie słowo dla dnia (także dni z pliku Z)
    Object.keys(kor).forEach(iso => {
      const i = +iso.slice(8) - 1, x = kor[iso]; if (iso.slice(0, 7) !== K || !(i >= 0 && i < N) || !x) return;
      const g = +x.godz || 12;
      d[i] = x.lok ? [x.lok, g, kwotaDnia(p, x.rola || p.rola, iso, g), 2] : 0;
    });
    const s = Object.assign({}, z.s || {}, kwotyMies(p.id, K));   // kwoty wpisane w aplikacji zastępują te z pliku Z
    s.podstawa = d.reduce((a, x) => a + (x ? x[2] || 0 : 0), 0);
    s.wyplacic = s.podstawa + (s.bonus || 0) + (s.dodatek || 0) - (s.potracenie || 0);
    s.pozostaje = s.wyplacic - (s.na_konto || 0) - (s.gotowka || 0);
    p.m[K] = { d, s, z: z.zr };
    p.dni[K] = d.filter(Boolean).length;
    d.forEach((x, i) => { if (x) { max = Math.max(max, i + 1); const iso = `${K}-${pad2(i + 1)}`; if (!p.last || p.last < iso) p.last = iso; } });
  });
  DO_LIS = max ? `${max}.11` : '';
  DO_Z = zmax;
  TXT.pl.do411 = DO_LIS ? 'do ' + DO_LIS : 'w toku';
  TXT.ua.do411 = DO_LIS ? 'до ' + DO_LIS : 'триває';
}
function kwotaDnia(p, rola, iso, H) {
  const st = (rola && rola !== '*' && !ROLE_DOD.includes(rola) && stawkaRoli(p.id, rola, iso)) || stawkaRoli(p.id, '*', iso) || domyslnaStawka(p);   // rola bez własnej stawki = podstawowa
  return Math.round(dniowkaZ(st, H || p.godz || 12));
}
function spozaOpis() {
  const m = {}; NIEZNANI.forEach(x => { const n = String(x.nazwa || '').trim() || 'bez nazwiska'; m[n] = (m[n] || 0) + 1; });
  return Object.keys(m).sort((a, b) => a.localeCompare(b, 'pl')).map(n => `${n} (${m[n]} ${odm(m[n], 'dzień', 'dni', 'dni')})`).join(', ');
}
function zaladuj(d, zachowaj) {
  const W = d.wspolne || {};
  DATA = { people: d.ludzie || [], prof: W.prof || {}, dec: W.dec || [], model: W.model || {}, meta: W.meta || {}, sprzedaz: W.sprzedaz || { mies: {}, dni: {} } };
  Object.keys(P).forEach(k => { delete P[k]; });
  DATA.people.forEach(p => {
    P[p.id] = p; p.dni = p.dni || {};
    MIESIACE.forEach(M => { if (!p.m[M.k]) p.m[M.k] = { d: Array(M.dni).fill(0), s: null }; });
    const m = p.m[MIES_ROZL]; p.mZ = { d: (m.d || []).slice(), s: Object.assign({}, m.s || {}), zr: m.z || '' };
  });
  SPRZ = DATA.sprzedaz && DATA.sprzedaz.mies ? DATA.sprzedaz : { mies: {}, dni: {} };
  const sd = SPRZ.mies[MIES_ROZL] && SPRZ.mies[MIES_ROZL].do; DO_SPRZ = sd ? `${+sd.slice(8)}.${+sd.slice(5, 7)}` : '';
  OB = {}; NIEZNANI = [];
  (d.obecni || []).forEach(x => {
    const iso = x[0], kl = x[1], lok = x[2], godz = +x[3] || 0, rola = x[4];
    if (!kl) { NIEZNANI.push({ iso, lok, nazwa: x[5] }); return; }
    const o = OB[kl] = OB[kl] || {};
    if (!o[iso]) o[iso] = { lok, godz, rola }; else o[iso].godz += godz;
  });
  const st = d.stan || {};
  KLUCZE_DOK.forEach(k => {
    const x = st[k];
    ustawDok(k, x ? x.v : undefined);
    SYNC.w[k] = (x && x.w) || 0; SYNC.js[k] = kan(x ? x.v : null);
  });
  S.wnioski = (d.wnioski || []).map(w => Object.assign({ od: null, do: null, kwota: null, raty: null, tekst: '', odp: '' }, w));
  S.pref = {};
  Object.keys(d.pref || {}).forEach(kk => {
    const [m, kl] = kk.split('|'), v = d.pref[kk] || {}; if (m !== MIES_PLAN) return;
    S.pref[kl] = { kiedy: v.kiedy || null }; if (v.robocze) S.pref[kl].robocze = v.robocze; if (v.wyslane) S.pref[kl].wyslane = v.wyslane;
  });
  SYNC.pref = JA.klucz && S.pref[JA.klucz] && S.pref[JA.klucz].robocze ? kan(S.pref[JA.klucz].robocze) : null;
  const typ = JA.rola;
  if (!(zachowaj && S.konto)) {
    S.konto = typ === 'prac' || typ === 'zarzad' ? { typ, id: JA.klucz } : { typ };
    S.zArch = false;
    if (typ === 'prac') S.jezyk = ((LS.get('jezyki', {}) || {})[JA.login]) || ((S.zal[JA.klucz] || {}).jezyk) || (JA.jezyk === 'ua' ? 'ua' : 'pl');   // język pamiętany dla loginu, nie dla urządzenia
  }
  migrujZal();
  przeliczListopad();
  if (typ === 'prac') declGen();
  else { const prev = PLANY_SERWER ? planyNaPrev(PLANY_SERWER) : null; uruchom(!prev, prev); }
  S.zmiany = new Set();
  S.dymek = typ === 'prac' ? null : dymekGotowe(true);
}

/* ───────── działania z zapisem na serwerze ───────── */
async function wyslijWniosek(wn) {
  const btn = $('#f-wn button[type="submit"]'); if (btn) btn.disabled = true;
  try {
    const r = await wKolejce(() => baza.rpc('team_wniosek_dodaj', { p_w: wn }));
    S.wnioski.push(Object.assign({ od: null, do: null, kwota: null, raty: null, tekst: '', odp: '' }, r));
    S.pTyp = null; S.pForm = null; S.pBlad = ''; render(); toast('ok', esc(t('ok_msg')));
  } catch (e) {

}
async function wyslijPref(id, r) {
  try {
    const odp = await wKolejce(() => baza.rpc('team_pref_zapisz', { p_miesiac: MIES_PLAN, p_robocze: r, p_wyslij: true }));
    S.pref[id].wyslane = odp.wyslane; S.pref[id].kiedy = odp.kiedy; SYNC.pref = kan(odp.robocze);
    uruchom(); render(); toast('ok', esc(t('ok_pref')));
  } catch (e) {
    if (e && e.sesja) { pokazLogowanie('Sesja wygasła — zaloguj się ponownie.'); return; }
    toast('czyta', esc(tekstBledu(e)));
  }
}
async function decyzja(wid, stan, kwOver, mimo) {
  const w = S.wnioski.find(x => x.id === wid); if (!w) return;
  if (!mozeZapisDok()) { toast('czyta', 'Tylko podgląd — decyzję podejmuje HR.'); return; }
  const kopia = { w: JSON.parse(JSON.stringify(w)), zal: JSON.parse(JSON.stringify(S.zaliczki)), poz: JSON.parse(JSON.stringify(S.pozyczki)) };
  decyzjaLokalna(wid, stan, kwOver, mimo);
  if (w.stan === kopia.w.stan && (w.odp || '') === (kopia.w.odp || '') && w.kwotaPrzyjeta === kopia.w.kwotaPrzyjeta) return;   // np. ponad limit — nic nie zmieniono
  try {
    await wKolejce(async () => {
      const zm = {};
      ['zaliczki', 'pozyczki'].forEach(k => { if (kan(S[k]) !== SYNC.js[k]) zm[k] = { w: SYNC.w[k] || 0, v: S[k] }; });
      const r = await baza.rpc('team_decyzja', { p_id: wid, p_w: { stan: w.stan, odp: w.odp || '', kwotaPrzyjeta: w.kwotaPrzyjeta == null ? null : w.kwotaPrzyjeta, ponadLimit: !!w.ponadLimit }, p_zmiany: zm });
      if (!r || !r.ok) { const e = new Error('KONFLIKT'); e.konflikt = true; throw e; }
      Object.keys(r.wersje || {}).forEach(k => { SYNC.w[k] = r.wersje[k]; SYNC.js[k] = kan(zm[k].v); });
      if (r.wniosek) Object.assign(w, r.wniosek);
      zapisOk();
    });
  } catch (e) {
    const i = S.wnioski.indexOf(w); if (i >= 0) S.wnioski[i] = kopia.w;
    S.zaliczki = kopia.zal; S.pozyczki = kopia.poz;
    if (e && e.sesja) { pokazLogowanie('Sesja wygasła — zaloguj się ponownie.'); return; }
    if (e && e.konflikt) { toast('czyta', 'W tej chwili ktoś zmienił zaliczki albo pożyczki — odświeżam dane. Zdecyduj jeszcze raz.'); await odswiezDane(true); return; }
    uruchom(); render();
    toast('czyta', esc(`Nie zapisałem decyzji: ${tekstBledu(e)}`));
  }
}

/* ───────── logowanie: wspólne okno dysza.app (jak manager i transport) ───────── */
function osobyUrz() {
  const tb = czytaj(KL.osoby, null), gr = Date.now() - 60 * 864e5;
  let lista = Array.isArray(tb) ? tb.filter(o => o && o.login && (o.ostatnio || 0) > gr) : [];
  if (!Array.isArray(tb)) { const l = czytaj(KL.login, ''); if (l) lista = [{ login: l, imie: l, dl: 0, ostatnio: Date.now() }]; }
  return lista.sort((a, b) => (b.ostatnio || 0) - (a.ostatnio || 0));
}
function zapamietajOsobe(o) {
  const n = osobyUrz().filter(x => x.login.toLowerCase() !== String(o.login).toLowerCase());
  n.unshift({ login: o.login, imie: o.imie || o.login, podpis: o.podpis || '', dl: o.dl || 0, ostatnio: Date.now() });
  pisz(KL.osoby, n.slice(0, 20));
}
function zapomnijOsobe(login) { pisz(KL.osoby, osobyUrz().filter(x => x.login !== login)); }
let WEJSCIE = null, ostatniPin = 0;
function wejscie() {
  if (WEJSCIE || !window.DyszaWejscie) return WEJSCIE;
  WEJSCIE = DyszaWejscie.utworz({
    modul: 'zespol', nazwa: 'ZESPÓŁ',
    opis: 'Pracownia Sushi · zarobki, grafik i sprawy do HR · każdy loguje się swoim PIN-em',
    kto: 'Kto się loguje? · Хто входить?',
    pomoc: 'Login z karty (np. AnnaNo) — ten sam co w managerze. Wielkość liter nie ma znaczenia.\nЛогін із картки (напр. AnnaNo). Регістр літер не має значення.',
    zdzKafelki: 'Jeden klucz do wszystkich drzwi dysza.app. Stuknij swój kafelek — PIN wpiszesz za chwilę.',
    zdzLogin: 'Twoje zarobki, grafik i sprawy do HR. Wpisz login z karty, potem PIN — ja w tym czasie się odwrócę.',
    edycja: true,
    osoby: () => osobyUrz().map(o => ({ login: o.login, imie: o.imie || o.login, podpis: o.podpis || '', dl: o.dl || 0 })),
    zapomnij: zapomnijOsobe,
    prosba: login => baza.prosba(login),
    motyw: () => (ciemny() ? 'ciemny' : 'jasny'),
    ustawMotyw: m => { const v = m === 'jasny' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', v); LS.set('motyw', v); },
    zaloguj: zalogujWejscie
  });
  return WEJSCIE;
}
function pokazLogowanie(komunikat) {
  clearTimeout(ODSW); clearTimeout(SYNC.czeka); SYNC.czeka = null;
  JA = null; S.konto = null; S.res = null;
  $('#nag').hidden = true; $('#nag').innerHTML = ''; $('#tresc').innerHTML = ''; $('#stopka').textContent = ''; $('#nakladka').innerHTML = ''; $('#toast').innerHTML = '';
  const w = wejscie();
  if (!w) { $('#tresc').innerHTML = '<section class="karta" style="margin:40px auto;max-width:520px"><p>Nie mogę pokazać logowania — odśwież stronę.</p></section>'; return; }
  const ost = osobyUrz()[0];
  if (komunikat && /^Sesja wygasła/.test(komunikat) && ost) w.pokaz({ krok: 'pin', osoba: { login: ost.login, imie: ost.imie, dl: ost.dl }, komunikat: komunikat });
  else w.pokaz(komunikat ? { komunikat: komunikat, rodzaj: /^Wylogowano/.test(komunikat) ? 'info' : 'blad' } : {});
}
function wejscieUkryj() { if (WEJSCIE) WEJSCIE.ukryj(); }
async function zalogujWejscie(osoba, pin) {                  // błąd → okno pokazuje komunikat (blokada po 5 złych PIN-ach liczy się na serwerze)
  const j = await baza.zaloguj(osoba.login, pin);
  if (j.stary) {
    await baza.wyloguj();
    throw new Error(j.nowy_login ? `To login ze starej aplikacji. Twój login: ${j.nowy_login} (PIN z managera).`
      : 'To login ze starej aplikacji — Zespół działa z kontem z manager.dysza.app (poproś zarządcę).');
  }
  pisz(KL.login, j.login || osoba.login);
  ostatniPin = pin.length;
  await startProd();
}
async function wyloguj() {
  try { clearTimeout(SYNC.czeka); SYNC.czeka = null; await wKolejce(zapiszTeraz); } catch (e) { /* bez sieci — trudno */ }
  await baza.wyloguj();
  pokazLogowanie('Wylogowano.');
}
function ekranInfo(rodzaj, tekst) {
  const u = JA && JA.jezyk === 'ua';
  const T2 = {
    wkrotce: [u ? 'Відкриваємо у вівторок' : 'Otwieramy we wtorek', u ? 'Команда відкривається у вівторок, 10.11. Тоді побачиш свій заробіток, графік і зможеш написати до HR.' : 'Zespół otwiera się we wtorek 10.11. Zobaczysz wtedy swoje zarobki, grafik i napiszesz do HR.', 'powitanie'],
    karta: [u ? 'Майже готово' : 'Prawie gotowe', BLEDY[u ? 'ua' : 'pl'].BRAK_KARTY, 'czyta'],
    laduje: ['ZDZISŁAW', 'Wczytuję dane Zespołu…', 'zebatki'],
    blad: [u ? 'Немає з’єднання' : 'Brak połączenia', (tekst || BLEDY.pl.siec) + (u ? ' Спробую ще раз за хвилину.' : ' Spróbuję ponownie za chwilę.'), 'czyta']
  }[rodzaj];
  $('#nag').hidden = true; $('#nag').innerHTML = ''; $('#stopka').textContent = '';
  const kto = JA ? (JA.kafelek || JA.imie || JA.login || '') : '';
  $('#tresc').innerHTML = `<div class="p-wit" style="max-width:640px;margin:48px auto 0">${zdz(T2[2])}${htmlDymka({ tyt: T2[0].toUpperCase(), html: `${kto && rodzaj !== 'laduje' ? `<b>${esc(kto)}</b> — ` : ''}${esc(T2[1])}` })}</div>
    ${rodzaj === 'laduje' ? '' : `<div class="przyciski" style="justify-content:center;margin-top:18px">${rodzaj === 'blad' ? `<button class="btn" data-a="ponow">${u ? 'Спробувати зараз' : 'Spróbuj teraz'}</button>` : ''}<button class="btn" data-a="przelacz">${ik.wyjdz} ${u ? 'Вийти' : 'Wyloguj'}</button></div>`}`;
}
async function startProd() {
  clearTimeout(ODSW);
  if (!baza.sesja()) { pokazLogowanie(''); return; }
  try {
    const ja = await baza.rpc('team_ja', {});
    if (!ja || !ja.rola) {
      await baza.wyloguj();
      pokazLogowanie(`${ja && ja.imie ? ja.imie + ': b' : 'B'}rak dostępu do Zespołu — poproś o rolę w manager.dysza.app.`);
      return;
    }
    JA = ja;
    const lg = ja.login || czytaj(KL.login, ''), dawna = osobyUrz().find(x => x.login.toLowerCase() === String(lg).toLowerCase());
    if (lg) zapamietajOsobe({ login: lg, imie: (ja.kafelek || '').trim() || ja.imie || lg, podpis: { arch: 'Architekt', hr: 'HR Manager', zarzad: 'Zarząd', prac: 'Zespół' }[ja.rola] || '', dl: ostatniPin || (dawna && dawna.dl) || 0 });
    ostatniPin = 0;
    wejscieUkryj();
    if (ja.rola === 'prac' && !ja.otwarte) { ekranInfo('wkrotce'); return; }
    if (ja.rola === 'prac' && !ja.klucz) { ekranInfo('karta'); return; }
    ekranInfo('laduje');
    const d = await baza.rpc('team_dane', {});
    wczytaj();
    zaladuj(d);
    trasa();
    planujOdswiezanie();
  } catch (e) {
    if (e && e.sesja) { pokazLogowanie('Sesja wygasła — zaloguj się ponownie.'); return; }
    const m = String((e && e.message) || '');
    if (m === 'WKROTCE') { ekranInfo('wkrotce'); return; }
    if (m === 'BRAK_KARTY') { ekranInfo('karta'); return; }
    if (m === 'BRAK_DOSTEPU') { await baza.wyloguj(); pokazLogowanie(BLEDY.pl.BRAK_DOSTEPU); return; }
    ekranInfo('blad', tekstBledu(e));
    ODSW = setTimeout(startProd, 20000);
  }
}
function planujOdswiezanie(ms) { clearTimeout(ODSW); ODSW = setTimeout(() => { odswiezDane(false); }, ms == null ? 180000 : ms); }
async function odswiezDane(wymus) {
  if (!JA || !baza.sesja() || !S.konto) return;
  const ae = document.activeElement, pole = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (!wymus && (document.hidden || pole || $('#nakladka').innerHTML || czekaNaZapis())) { planujOdswiezanie(60000); return; }
  try {
    await wKolejce(async () => {
      const d = await baza.rpc('team_dane', {});
      const widok = S.widok, y = window.scrollY;
      zaladuj(d, true);
      S.widok = widok; render(); window.scrollTo(0, y);
    });
  } catch (e) {
    if (e && e.sesja) { pokazLogowanie('Sesja wygasła — zaloguj się ponownie.'); return; }
  }
  planujOdswiezanie();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && JA && S.konto) planujOdswiezanie(1500); });
window.addEventListener('pagehide', () => { if (SYNC.czeka) { clearTimeout(SYNC.czeka); SYNC.czeka = null; wKolejce(zapiszTeraz).catch(() => {}); } });
Object.assign(A, { ponow: () => { startProd(); } });

(function () {
  const m = LS.get('motyw', null); if (m) document.documentElement.setAttribute('data-theme', m);
  startProd();
})();
