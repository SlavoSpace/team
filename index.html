<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zespół</title>
<meta name="team-wersja" content="1.4 · 2026-11-09">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
/* team.dysza.app — moduł Zespół w systemie Dysza.App (te same żetony co Manager, Tablica, Spis, Raporty).
   Układ: nagłówek 60 px · jedna kolumna treści do 1440 px · Harmonogram: ZDZISŁAW i ustawienia → wynik → kalendarz obciążenia → poziom sprawiedliwości → grafik → luki.
   Akcent jeden: turkus Harmonogramów = „poziom wody” i obciążenie; zieleń = akcja; czerwień = luka. */
:root{
  --tlo:#F3F6F4;--pow:#FFFFFF;--pow2:#FAFCFB;--pow3:#EEF3F0;--wybrany:#E6F3EA;--linia:#DCE4DF;--ramka:#D3DDD7;--ramka2:#C2CFC8;
  --tekst:#13201A;--tekst2:#4B5D53;--tekst3:#5F7067;
  --akcja:#0F7A39;--naAkcji:#FFFFFF;--moc:#1E63B5;--pelne:#9A5B00;--zaduzo:#C62828;--zaduzoTlo:#FDECEC;--wolne:#0F7A39;
  --uwTlo:#FFF4DE;--uwTekst:#7A4700;--uwRamka:#E3BE73;--arch:#9A6B10;--archTlo:#FBF1DA;
  --har:#2E8A8A;--harTlo:#E3F2F1;--harMocny:#1F6B68;
  --Fc:#3F7357;--Ftx:#FFFFFF;--Rc:#DE9B66;--Rtx:#2A1608;--Uc:#D3DDD7;--Utx:#33423A;
  --h1:#EEF7F6;--h2:#D2EAE8;--h3:#A8D5D1;--h4:#6FB5B0;--h5:#3A8E8A;--h6:#1F6B68;
  --h1t:#13201A;--h2t:#13201A;--h3t:#13201A;--h4t:#0B1A17;--h5t:#FFFFFF;--h6t:#FFFFFF;
  --cien:rgba(19,32,26,.12);--zaslona:rgba(19,32,26,.42);
  --f-tyt:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;
  --f-tresc:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;
  --tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;
  --akcja:#5DFF8A;--naAkcji:#052012;--moc:#7CC0FF;--pelne:#FFC85C;--zaduzo:#FF7A7A;--zaduzoTlo:#2A1515;--wolne:#5DFF8A;
  --uwTlo:#2A2213;--uwTekst:#FFD27A;--uwRamka:#6E5422;--arch:#E8C06A;--archTlo:#2A2210;
  --har:#7FD6D6;--harTlo:#12302F;--harMocny:#A9E8E6;
  --Fc:#3F7A57;--Ftx:#F2FFF6;--Rc:#E8AE84;--Rtx:#2A1608;--Uc:#2C3832;--Utx:#C9D6CF;
  --h1:#111D1B;--h2:#14302E;--h3:#1A4644;--h4:#226260;--h5:#348784;--h6:#7FD6D6;
  --h1t:#C9D6CF;--h2t:#DDE8E3;--h3t:#EEF4F0;--h4t:#FFFFFF;--h5t:#FFFFFF;--h6t:#06201F;
  --cien:rgba(0,0,0,.45);--zaslona:rgba(0,0,0,.62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;
  --tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;
  --akcja:#5DFF8A;--naAkcji:#052012;--moc:#7CC0FF;--pelne:#FFC85C;--zaduzo:#FF7A7A;--zaduzoTlo:#2A1515;--wolne:#5DFF8A;
  --uwTlo:#2A2213;--uwTekst:#FFD27A;--uwRamka:#6E5422;--arch:#E8C06A;--archTlo:#2A2210;
  --har:#7FD6D6;--harTlo:#12302F;--harMocny:#A9E8E6;
  --Fc:#3F7A57;--Ftx:#F2FFF6;--Rc:#E8AE84;--Rtx:#2A1608;--Uc:#2C3832;--Utx:#C9D6CF;
  --h1:#111D1B;--h2:#14302E;--h3:#1A4644;--h4:#226260;--h5:#348784;--h6:#7FD6D6;
  --h1t:#C9D6CF;--h2t:#DDE8E3;--h3t:#EEF4F0;--h4t:#FFFFFF;--h5t:#FFFFFF;--h6t:#06201F;
  --cien:rgba(0,0,0,.45);--zaslona:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--tekst);font-family:var(--f-tresc);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default;opacity:.55}
:focus{outline:none}
:focus-visible{outline:3px solid var(--moc);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
svg{display:block;flex:0 0 auto}
.bebas{font-family:var(--f-tyt);font-weight:400;letter-spacing:.05em;line-height:1}
.etykieta{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.cyfry{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.mala{font-size:12.5px;color:var(--tekst3)}
.ukryte{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes wjazd{from{transform:translateY(10px);opacity:.001}to{transform:none;opacity:1}}

/* ── nagłówek ── */
.nag{position:sticky;top:0;z-index:20;min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));background:var(--tlo);border-bottom:1px solid var(--linia)}
.nag-l{display:flex;align-items:center;gap:10px;min-height:60px}
.nag-tyt{font-size:30px;padding-top:3px}
.chip{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;border:1px solid var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst);white-space:nowrap}
.nawig{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.nawig-w{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--pow);border:1px solid var(--ramka);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nawig-w::-webkit-scrollbar{display:none}
.nawig-w button{height:38px;padding:0 13px;border-radius:9px;font-size:14px;font-weight:700;color:var(--tekst2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.nawig-w button[aria-current="page"]{background:var(--tekst);color:var(--tlo)}
.nag-p{display:flex;align-items:center;gap:12px;min-height:60px}
.kto{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--tekst2);white-space:nowrap}
.arch{font-size:10.5px;font-weight:800;letter-spacing:.09em;padding:3px 7px;border-radius:6px;color:var(--arch);background:var(--archTlo);border:1px solid color-mix(in srgb,var(--arch) 45%,transparent)}
.nag-czas{font-size:22px;padding-top:2px;font-variant-numeric:tabular-nums}
.ikbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--ramka);background:var(--pow);display:grid;place-items:center;color:var(--tekst2)}
@media (max-width:860px){
  .nag{gap:0 10px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .nawig{order:3;flex:1 0 100%;justify-content:flex-start;padding-bottom:10px}
  .nag-l{min-height:54px}.nag-p{min-height:54px;margin-left:auto}
  .kto .imie{display:none}
}
@media (max-width:600px){.kto,.nag-czas{display:none}.nag-tyt{font-size:26px}.nawig-w button{height:34px;padding:0 9px;font-size:13px}}

/* ── treść ── */
main{max-width:1440px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){main{padding:16px 16px 32px;gap:14px}}
.karta{background:var(--pow);border:1px solid var(--ramka);border-radius:18px;padding:18px 20px}
@media (max-width:600px){.karta{padding:14px 14px;border-radius:16px}}
.karta-gl{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
.karta-gl h2{font-family:var(--f-tyt);font-weight:400;letter-spacing:.05em;font-size:26px;line-height:1}
.wyp-tyt{display:flex;align-items:center;flex-wrap:wrap;gap:10px 20px;margin-top:4px}
.druk-p{display:flex;flex-wrap:wrap;gap:8px}
.btn:disabled{opacity:.6;cursor:default}
.karta-gl .opis{font-size:13.5px;color:var(--tekst2);max-width:70ch;margin-top:5px}
.przyciski{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--ramka2);background:var(--pow2);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;color:var(--tekst)}
.btn:hover{background:var(--pow3)}
.glowny{min-height:54px;padding:0 22px;border-radius:15px;background:var(--akcja);color:var(--naAkcji);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px color-mix(in srgb,var(--akcja) 28%,transparent)}
.glowny:hover:not(:disabled){filter:brightness(1.04)}
.glowny .ik{animation:none}
.glowny.pracuje .ik{animation:obrot 1.1s linear infinite}
@keyframes obrot{to{transform:rotate(360deg)}}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--pow3);border:1px solid var(--ramka);gap:2px;flex-wrap:wrap}
.seg button{min-height:34px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:700;color:var(--tekst2)}
.seg button[aria-pressed="true"]{background:var(--pow);color:var(--tekst);box-shadow:0 1px 3px var(--cien);outline:1px solid var(--ramka2)}
.krok{display:inline-flex;align-items:center;border:1px solid var(--ramka);border-radius:11px;background:var(--pow3);padding:3px}
.krok button{width:34px;height:34px;border-radius:8px;font-size:18px;font-weight:700;color:var(--tekst2)}
.krok button:hover{background:var(--pow)}
.krok b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}

/* ── ZDZISŁAW ── */
.zdz{position:relative;display:block;flex:0 0 auto}
.zdz img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;pointer-events:none}
.zdz.unosi img{animation:unos 3.4s ease-in-out infinite}
@keyframes unos{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.zdz.unosi::after{content:"";position:absolute;left:22%;right:22%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(111,211,255,.42),rgba(111,211,255,0));animation:pole 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pole{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.dymek{position:relative;background:#1d1d1d;color:#e8f3ec;border:2px solid #9fe3b4;border-radius:16px;padding:12px 15px 13px;box-shadow:0 6px 22px rgba(0,0,0,.18);font-size:14.5px;line-height:1.5}
.dymek .d-tyt{font-family:var(--f-tyt);letter-spacing:.07em;color:#9fe3b4;font-size:17px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.dymek .kursor{width:8px;height:15px;background:#e2a54e;display:inline-block;animation:mrugK 1s steps(1) infinite}
@keyframes mrugK{50%{opacity:0}}
.dymek b{color:#fff}
.dymek .d-pod{margin-top:8px;font-size:12.5px;color:#a9c9b6;font-style:italic}
.dymek ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.dymek ol li{animation:wjazd .25s ease both}
.dymek ol li.ok::marker{color:#9fe3b4}
.dymek::after{content:"";position:absolute;width:16px;height:16px;background:#1d1d1d;border:2px solid #9fe3b4;border-top:0;border-left:0}
.dymek.ogon-dol::after{left:var(--ogon,50%);bottom:-10px;transform:translateX(-50%) rotate(45deg)}
.dymek.ogon-lewo::after{left:-10px;top:var(--ogon,40px);transform:rotate(135deg)}
@media (prefers-reduced-motion:reduce){.zdz.unosi img,.zdz.unosi::after,.dymek .kursor,.dymek ol li{animation:none}}

/* ── Harmonogram: góra ── */
.hero{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;align-items:stretch}
.zdz-panel{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;padding:6px 6px 0}
.zdz-panel .dymek{width:100%}
.zdz-panel .zdz{width:min(200px,62%)}
.ster{display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.ster h1{font-family:var(--f-tyt);font-weight:400;letter-spacing:.04em;font-size:clamp(46px,6vw,76px);line-height:.9}
.ster .pod{font-size:14.5px;color:var(--tekst2);margin-top:8px}
.opcje{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
.opcja{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.ster-dol{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.wersja{font-size:12.5px;color:var(--tekst3);max-width:44ch}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .zdz-panel{flex-direction:row;align-items:flex-end;padding:0}
  .zdz-panel .zdz{width:96px;order:-1;margin-bottom:-4px}
  .zdz-panel .dymek{flex:1;margin-bottom:6px}
  .zdz-panel .dymek.ogon-dol::after{left:-10px;top:auto;bottom:22px;transform:rotate(135deg)}
}

/* ── kafle ── */
.kafle{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kafel{background:var(--pow);border:1px solid var(--ramka);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kafel .w{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.kafel .w small{font-size:15px;font-weight:600;color:var(--tekst2)}
.kafel .p{font-size:12.5px;color:var(--tekst2)}
.kafel.alarm{border-color:color-mix(in srgb,var(--zaduzo) 55%,var(--ramka))}
.kafel.alarm .w{color:var(--zaduzo)}
.stan{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.stan.ok{color:var(--wolne)}.stan.zle{color:var(--zaduzo)}.stan.uw{color:var(--pelne)}

/* ── kalendarz obciążenia ── */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kal .wd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);padding:0 4px 2px}
.dz{position:relative;min-height:96px;border-radius:12px;padding:7px 8px 8px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;transition:transform .12s ease}
.dz:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--cien)}
.dz .g{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.dz .n{font-family:var(--f-tyt);font-size:22px;line-height:1;letter-spacing:.03em}
.dz .l{font-size:10.5px;font-weight:700;line-height:1.15;text-align:right;opacity:.92}
.dz .os{margin-top:auto;font-size:21px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dz .os small{font-size:11px;font-weight:600;margin-left:2px;opacity:.85}
.dz .fr{font-size:11px;font-variant-numeric:tabular-nums;opacity:.86}
.dz .pok{position:absolute;right:7px;bottom:7px;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--pow);color:var(--tekst2);border:1px solid var(--ramka)}
.dz .pok.luka{color:var(--zaduzo);border-color:color-mix(in srgb,var(--zaduzo) 50%,var(--ramka))}
.dz .ogien{position:absolute;right:6px;top:30px;opacity:.95}
.dz.h1{background:var(--h1);color:var(--h1t)}.dz.h2{background:var(--h2);color:var(--h2t)}.dz.h3{background:var(--h3);color:var(--h3t)}
.dz.h4{background:var(--h4);color:var(--h4t)}.dz.h5{background:var(--h5);color:var(--h5t)}.dz.h6{background:var(--h6);color:var(--h6t)}
.dz.zamk{background:repeating-linear-gradient(135deg,var(--pow3) 0 7px,var(--pow2) 7px 14px);color:var(--tekst3);border-color:var(--ramka)}
.dz.zamk .os{font-size:13px;font-weight:700}
.dz.zmieniony{outline:2px solid var(--uwRamka);outline-offset:1px}
.dz.pusty{background:none;border:0;min-height:0}
.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12px;color:var(--tekst2);margin-top:12px}
.legenda .skala{display:inline-flex;align-items:center;gap:3px}
.legenda .skala i{width:18px;height:12px;border-radius:3px;display:inline-block}
.legenda .kres{width:18px;height:12px;border-radius:3px;display:inline-block;background:repeating-linear-gradient(135deg,var(--pow3) 0 4px,var(--ramka2) 4px 6px)}
@media (max-width:640px){
  .kal{gap:4px}.dz{min-height:76px;padding:5px 5px 6px;border-radius:9px}
  .dz .n{font-size:17px}.dz .l{display:none}.dz .os{font-size:16px}.dz .os small{display:none}.dz .fr{display:none}
  .dz .pok{position:static;align-self:flex-start;margin-top:3px;padding:1px 4px;font-size:9.5px}
  .dz .ogien{top:5px;right:4px}
}

/* ── sprawiedliwość ── */
.spr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.spr-k{border:1px solid var(--ramka);border-radius:14px;padding:12px 14px 10px;background:var(--pow2);display:flex;flex-direction:column;gap:8px}
.spr-g{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.spr-g b{font-size:15px}
.spr-g span{font-size:12.5px;color:var(--tekst2)}
.spr-k svg{width:100%;height:auto;overflow:visible}
.spr-k svg .bar{fill:var(--har);transition:opacity .15s}
.spr-k svg .bar.lim{fill:var(--ramka2)}
.spr-k svg .hit{fill:transparent;cursor:pointer}
.spr-k svg .hit:hover+.bar,.spr-k svg .hit:focus+.bar{opacity:.75}
.spr-k svg .poz{stroke:var(--harMocny);stroke-width:1.5;stroke-dasharray:5 4}
.spr-k svg .baza{stroke:var(--ramka2);stroke-width:1}
.spr-k svg text{fill:var(--tekst3);font-size:9px;font-family:var(--f-tresc)}
.spr-k svg text.pl{fill:var(--tekst2);font-weight:700;font-size:9.5px}
.spr-s{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--tekst2)}
.spr-s b{color:var(--tekst);font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--tekst2);margin-top:12px;align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg .lp{width:18px;height:0;border-top:2px dashed var(--harMocny);border-radius:0;vertical-align:3px}

/* ── siatka grafiku / obecności ── */
.narz{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filtry{display:flex;gap:6px;flex-wrap:wrap}
.narz.zalN{align-items:flex-start}

.filtry button{min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--ramka);background:var(--pow2);font-size:12.5px;font-weight:700;color:var(--tekst2)}
.filtry button[aria-pressed="true"]{background:var(--tekst);color:var(--tlo);border-color:var(--tekst)}
.przew{overflow:auto;max-height:min(76vh,1100px);border:1px solid var(--ramka);border-radius:12px;background:var(--pow);overscroll-behavior:contain}
table.sia{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.sia th,.sia td{padding:0;border-bottom:1px solid var(--linia);height:30px;text-align:center;white-space:nowrap}
.sia thead th{position:sticky;top:0;z-index:3;background:var(--pow2);height:44px;font-weight:700;color:var(--tekst2);border-bottom:1px solid var(--ramka)}
.sia thead th .dn{display:block;font-family:var(--f-tyt);font-size:17px;letter-spacing:.03em;color:var(--tekst);line-height:1}
.sia thead th .dtg{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tekst3);margin-top:2px}
.sia th.we,.sia td.we{background:color-mix(in srgb,var(--pow3) 70%,transparent)}
.sia thead th.we{background:var(--pow3)}
.sia th.dzis{box-shadow:inset 0 -3px 0 var(--moc)}
.sia .os{position:sticky;left:0;z-index:2;background:var(--pow);text-align:left;padding:0 10px 0 12px;min-width:176px;max-width:176px;border-right:1px solid var(--ramka)}
.sia thead .os{z-index:4;background:var(--pow2)}
.sia .os button{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--tekst2);text-align:left}
.sia .os button b{color:var(--tekst);font-weight:700}
.sia .os button:hover b{text-decoration:underline}
.sia .os .znak{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;color:var(--uwTekst);background:var(--uwTlo);border:1px solid var(--uwRamka);border-radius:5px;padding:0 4px;vertical-align:1px}
.sia tr.grupa td{position:sticky;left:0;background:var(--pow3);height:34px;text-align:left;padding:0 12px;font-size:12.5px;color:var(--tekst2);border-bottom:1px solid var(--ramka)}
.sia tr.grupa td b{color:var(--tekst);font-size:13px;margin-right:8px}
.sia td.c{min-width:31px;width:31px}
.sia td.sum,.sia th.sum{min-width:58px;padding:0 8px;font-variant-numeric:tabular-nums;text-align:right;color:var(--tekst2)}
.sia td.sum b{color:var(--tekst)}
.sia td.sum.odch b{color:var(--pelne)}
.k{display:inline-grid;place-items:center;width:25px;height:22px;border-radius:6px;font-size:11.5px;font-weight:800;position:relative;line-height:1}
.k.F{background:var(--Fc);color:var(--Ftx)}
.k.R{background:var(--Rc);color:var(--Rtx)}
.k.U{background:var(--Uc);color:var(--Utx)}
.k sup{position:absolute;top:-6px;right:-5px;font-size:8.5px;font-weight:800;background:var(--pow);color:var(--tekst2);border:1px solid var(--ramka);border-radius:5px;padding:0 2px;line-height:11px}
.k.x{width:25px;height:22px;border:1.5px dashed color-mix(in srgb,var(--zaduzo) 70%,transparent);color:var(--zaduzo);font-weight:800}
.k.zam{width:100%;height:100%;border-radius:0;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ramka2) 55%,transparent) 5px 7px)}
.sia td.c button{width:100%;height:29px;display:grid;place-items:center}
.sia td.c button:hover .k:not(.zam){transform:scale(1.08)}
.sia td.c button:hover .pusta{background:var(--pow3)}
.pusta{display:inline-block;width:25px;height:22px;border-radius:6px}
.zmiana .k{animation:blysk 1.2s ease}
@keyframes blysk{0%{box-shadow:0 0 0 0 var(--uwRamka)}30%{box-shadow:0 0 0 4px var(--uwRamka)}100%{box-shadow:0 0 0 0 transparent}}
.sia.wjazd td.c .k{animation:wjazd .35s ease both;animation-delay:calc(var(--i,0) * 22ms)}
@media (prefers-reduced-motion:reduce){.sia.wjazd td.c .k,.zmiana .k{animation:none}}
.sia tfoot td{position:sticky;bottom:0;background:var(--pow2);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--tekst2);border-top:1px solid var(--ramka);border-bottom:0;height:26px}
.sia tfoot tr:nth-child(2) td{bottom:26px}.sia tfoot tr:nth-child(1) td{bottom:52px}
.sia tfoot tr.trzy td{bottom:0}
.sia tfoot td.os{z-index:3;font-weight:700;color:var(--tekst2);font-size:12px}
.sia tfoot .luka{color:var(--zaduzo);font-weight:800}
.sia tfoot .pelno{color:var(--wolne);font-weight:700}
@media (max-width:600px){.sia .os{min-width:122px;max-width:122px;padding:0 6px 0 8px}.sia .os button{font-size:12px}.przew{max-height:70vh}}

/* ── luki ── */
.luki{display:flex;flex-direction:column;gap:10px}
.luka-w{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--ramka);background:var(--pow2)}
.luka-w.zle{border-color:color-mix(in srgb,var(--zaduzo) 45%,var(--ramka));background:color-mix(in srgb,var(--zaduzoTlo) 60%,var(--pow2))}
.luka-w .data{font-family:var(--f-tyt);font-size:22px;letter-spacing:.03em;line-height:1;grid-row:span 2;min-width:64px}
.luka-w .data small{display:block;font-family:var(--f-tresc);font-size:11px;letter-spacing:0;color:var(--tekst3);margin-top:3px;text-transform:none}

.luka-w .jak{font-size:13.5px;color:var(--tekst2)}

.dobrze{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--wybrany);color:var(--tekst2)}

/* ── tabela wypłat ── */
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tab th,.tab td{padding:8px 10px;border-bottom:1px solid var(--linia);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tab thead th{position:sticky;top:0;background:var(--pow2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tekst3);z-index:2;border-bottom:1px solid var(--ramka)}
.tab .l{text-align:left}
.tab td.os{position:sticky;left:0;background:var(--pow);text-align:left;min-width:190px}
.tab thead th.os{position:sticky;left:0;z-index:3}
.tab tr.grupa td{background:var(--pow3);font-weight:700;color:var(--tekst);text-align:left}
.tab tr.grupa td.liczba{text-align:right;color:var(--tekst2)}
.tab tr.razem td{font-weight:800;background:var(--pow2);border-top:2px solid var(--ramka2)}
.tab .minus{color:var(--zaduzo)}
.tab .zero{color:var(--tekst3)}
.tab .mono{font-family:var(--f-mono);font-size:12.5px}

/* ── podejście ── */
.dwa{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.dwa{grid-template-columns:1fr}}
.mapa{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.mapa td{padding:10px 12px;border-bottom:1px solid var(--linia);vertical-align:top}
.mapa td:first-child{color:var(--tekst2);width:44%}
.mapa td:first-child code{font-family:var(--f-mono);font-size:12px;background:var(--pow3);border:1px solid var(--ramka);border-radius:5px;padding:0 4px;color:var(--tekst)}
.mapa tr:last-child td{border-bottom:0}
.kroki{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;counter-reset:k}
.krok-k{border:1px solid var(--ramka);border-radius:14px;padding:14px;background:var(--pow2);display:flex;flex-direction:column;gap:6px}
.krok-k .nr{font-family:var(--f-tyt);font-size:30px;line-height:1;color:var(--har)}
.krok-k h3{font-size:15px}
.krok-k p{font-size:13.5px;color:var(--tekst2)}
.przeplyw{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.wezel{flex:1 1 0;border:1px solid var(--ramka);border-radius:12px;padding:10px 12px;background:var(--pow2);font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:140px}
.wezel b{font-size:13.5px}
.wezel span{color:var(--tekst2);font-size:12.5px}
.wezel.ten{border-color:var(--har);background:var(--harTlo)}
.strz{align-self:center;color:var(--tekst3);font-size:18px;font-weight:700}

.tabele{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tabela{border:1px solid var(--ramka);border-radius:12px;padding:10px 12px;background:var(--pow2);font-size:12.5px}

.tabela.nowa{border-style:dashed}
.lista{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--tekst2)}

/* ── nakładki ── */
.zaslona{position:fixed;inset:0;background:var(--zaslona);z-index:40;display:flex;justify-content:flex-end;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.szuflada{width:min(480px,100%);height:100%;background:var(--pow);border-left:1px solid var(--ramka);overflow:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:16px;animation:wsun .22s ease}

@media (max-width:640px){.zaslona{align-items:flex-end}.szuflada{height:auto;max-height:90%;border-radius:18px 18px 0 0;border-left:0;padding:16px 16px 28px;animation:wsunD .22s ease}}

.sz-g{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sz-g h2{font-family:var(--f-tyt);font-weight:400;font-size:32px;letter-spacing:.04em;line-height:1}
.kz-nag{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.kz-tel{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--ramka2);border-radius:999px;background:var(--pow2);color:var(--tekst);font:600 15px/1 var(--f-mono);text-decoration:none;white-space:nowrap}
.kz-tel:hover{border-color:var(--akcja);color:var(--akcja)}
.kz-tel.brak{border-style:dashed;background:none;color:var(--tekst3);font:500 13px/1 var(--f-tresc)}
.sia td.kor .k,.legenda .k.kor{box-shadow:0 0 0 2px var(--moc)}
.sia td[data-a="obKor"]{cursor:pointer}
.tab.wyp th.ed,.tab.wyp td.ed{width:44px;padding-left:4px;padding-right:4px;text-align:center}
.tab.wyp td.ed .ikbtn{width:32px;height:32px;border-radius:9px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sz-sek{display:flex;flex-direction:column;gap:8px}
.pasek{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--pow3);gap:2px}
.pasek i{display:block;height:100%}
.nawyki{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:70px}
.nawyki div{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.nawyki i{display:block;width:70%;max-width:24px;background:var(--har);border-radius:4px 4px 0 0;min-height:2px}
.nawyki span{font-size:10.5px;color:var(--tekst3);font-weight:700}
.wiersze{display:flex;flex-direction:column;border:1px solid var(--ramka);border-radius:12px;overflow:hidden}
.wiersze div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--linia);font-size:13.5px}
.wiersze div:last-child{border-bottom:0}
.wiersze span{color:var(--tekst2)}
.wiersze b{font-variant-numeric:tabular-nums}
.mkal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mkal span{font-size:10.5px;font-weight:700;color:var(--tekst3);text-align:center;text-transform:uppercase}
.mkal button{height:36px;border-radius:8px;border:1px solid var(--ramka);background:var(--pow2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mkal button.off{border:1.5px dashed var(--zaduzo);color:var(--zaduzo);background:var(--zaduzoTlo)}
.mkal button.pl{background:var(--wybrany)}
.mkal button:disabled{background:repeating-linear-gradient(135deg,var(--pow3) 0 5px,var(--pow2) 5px 10px);color:var(--tekst3)}
.tryby{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tryby button{border:1px solid var(--ramka);border-radius:12px;padding:10px 12px;background:var(--pow2);text-align:left;display:flex;flex-direction:column;gap:2px}
.tryby button b{font-size:14px}
.tryby button span{font-size:12px;color:var(--tekst2)}
.tryby button[aria-pressed="true"]{border-color:var(--har);background:var(--harTlo);box-shadow:inset 0 0 0 1px var(--har)}
.tabm{width:100%;border-collapse:collapse;font-size:13px}
.tabm th,.tabm td{padding:6px 8px;border-bottom:1px solid var(--linia);text-align:right;font-variant-numeric:tabular-nums}
.tabm th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tekst3)}
.tabm td:first-child,.tabm th:first-child{text-align:left}
.tabm .luka{color:var(--zaduzo);font-weight:800}
.imiona{display:flex;flex-wrap:wrap;gap:5px}
.imiona span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--ramka);background:var(--pow2)}
.imiona span.F{border-color:color-mix(in srgb,var(--Fc) 60%,var(--ramka))}
.imiona span.R{border-color:color-mix(in srgb,var(--Rc) 70%,var(--ramka))}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--tekst);color:var(--tlo);font-size:12.5px;line-height:1.35;padding:7px 10px;border-radius:9px;box-shadow:0 6px 18px var(--cien);max-width:260px;opacity:0;transition:opacity .1s}
.tip.wid{opacity:1}
.tip b{font-size:14px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;background:#1d1d1d;color:#e8f3ec;border:2px solid #9fe3b4;border-radius:14px;padding:10px 14px;font-size:13.5px;max-width:min(560px,calc(100% - 24px));box-shadow:0 10px 30px rgba(0,0,0,.3);animation:wjazd .2s ease}

.stopka{font-size:12px;color:var(--tekst3);text-align:center;padding:4px 0 10px;max-width:90ch;margin:0 auto}
textarea.kopia{width:100%;height:220px;font-family:var(--f-mono);font-size:11.5px;border-radius:10px;border:1px solid var(--ramka);background:var(--pow2);color:var(--tekst);padding:10px}

/* ── v2: wejście, role, widok pracownika, wnioski ── */
.licz{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--zaduzo);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

.rola-b.hr{color:var(--harMocny);background:var(--harTlo);border-color:color-mix(in srgb,var(--har) 45%,transparent)}
.rola-b.arch{color:var(--arch);background:var(--archTlo);border-color:color-mix(in srgb,var(--arch) 45%,transparent)}

.jez{display:inline-flex;border:1px solid var(--ramka);border-radius:10px;overflow:hidden;background:var(--pow)}

#nag[hidden]{display:none}
/* wejście */
.start-w{width:min(1040px,100%);margin:0 auto;padding:12px 0 24px;display:flex;flex-direction:column;gap:22px}
.start-gora{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.start-logo{font-size:58px}

.start-zdz{display:flex;flex-direction:column;align-items:center;gap:14px}

.konta{display:flex;flex-direction:column;gap:12px}

.konto-p .konto .login{grid-column:2}
.wybor{display:flex;gap:8px;flex-wrap:wrap}
select.sel{min-height:46px;border-radius:12px;border:1px solid var(--ramka2);background:var(--pow2);padding:0 12px;font-size:15px;color:var(--tekst);flex:1 1 240px;min-width:0;font-family:inherit}

@media (max-width:860px){.start-uklad{grid-template-columns:1fr}.start-zdz{flex-direction:row;align-items:flex-end;order:-1}.start-zdz .zdz{width:96px;order:-1;margin-bottom:-4px}.start-zdz .dymek{flex:1;margin-bottom:8px}.start-zdz .dymek.ogon-dol::after{left:-10px;top:auto;bottom:22px;transform:rotate(135deg)}.start-logo{font-size:46px}}
/* pracownik */

.p-siatka{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.duza{font-size:42px;font-weight:700;letter-spacing:-.01em;line-height:1.05;margin-top:4px}
.duza-p{font-size:14px;color:var(--tekst2);margin-top:4px}
.rozl{display:flex;flex-direction:column;border:1px solid var(--ramka);border-radius:12px;overflow:hidden}
.rozl div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--linia);font-size:14px}
.rozl div:last-child{border-bottom:0}
.rozl span{color:var(--tekst2)}
.rozl b{font-variant-numeric:tabular-nums}
.rozl .suma{background:var(--pow3)}
.rozl .suma b{font-size:16px}
.rozl .minus b{color:var(--zaduzo)}
.mk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mk .wd{font-size:10.5px;font-weight:700;color:var(--tekst3);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.mk-d{min-height:60px;border-radius:10px;border:1px solid var(--linia);background:var(--pow2);padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--tekst2);font-variant-numeric:tabular-nums;min-width:0}
.mk-d .n{font-family:var(--f-tyt);font-size:17px;line-height:1;color:var(--tekst);align-self:flex-start;padding-left:2px}
.mk-d .k{width:24px;height:20px;font-size:11px}
.mk-d.pusty{border:0;background:none;min-height:0}
.mk-d.zam{background:repeating-linear-gradient(135deg,var(--pow3) 0 6px,var(--pow2) 6px 12px);color:var(--tekst3)}
button.mk-d{cursor:pointer;font:inherit;font-size:10.5px}
button.mk-d:disabled{cursor:default}
.mk-d.off{border:1.5px dashed var(--zaduzo);background:var(--zaduzoTlo);color:var(--zaduzo);font-weight:800}
.mk-d.off .n,.mk-d.want .n{color:inherit}
.mk-d.want{border:1.5px solid var(--wolne);background:color-mix(in srgb,var(--wolne) 12%,var(--pow2));color:var(--wolne);font-weight:800}
.mk-d .zn{font-size:17px;line-height:1;margin-top:3px;font-weight:800}
.leg-p{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tekst2);margin-top:10px;align-items:center}
.leg-p i{display:inline-block;width:16px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.slupki-h{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.slupki-h div{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.slupki-h i{display:block;height:16px;border-radius:0 4px 4px 0;background:var(--har);min-width:2px}
.slupki-h i.biez{background:color-mix(in srgb,var(--har) 50%,var(--pow3))}
.slupki-h b{font-variant-numeric:tabular-nums;font-size:13.5px}
.typy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.typ{border:1px solid var(--ramka);border-radius:16px;padding:16px 8px 14px;background:var(--pow2);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13.5px;text-align:center;color:var(--tekst)}
.typ svg{width:34px;height:34px;color:var(--har)}
.typ.choroba svg{color:var(--zaduzo)}
.typ.inne svg{color:var(--tekst2)}
.typ[aria-pressed="true"]{border-color:var(--har);background:var(--harTlo);box-shadow:inset 0 0 0 1px var(--har)}
.typ.choroba[aria-pressed="true"]{border-color:var(--zaduzo);background:var(--zaduzoTlo);box-shadow:inset 0 0 0 1px var(--zaduzo)}
.formularz{display:flex;flex-direction:column;gap:12px;max-width:620px}
.formularz .rzad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pole{display:flex;flex-direction:column;gap:6px;min-width:0}
.pole label,.pole .etykieta{font-size:11px;font-weight:700;color:var(--tekst3);text-transform:uppercase;letter-spacing:.08em}
.pole input,.pole textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ramka2);background:var(--pow2);padding:10px 12px;font-size:16px;color:var(--tekst);font-family:inherit}
.pole textarea{min-height:84px;resize:vertical}
.blad{color:var(--zaduzo);font-weight:700;font-size:13.5px}
.zgl{border:1px solid var(--ramka);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--pow2)}
.zgl .gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.zgl q,.wn q{color:var(--tekst2);font-size:13.5px}
.zgl .odp{font-size:13.5px;border-left:3px solid var(--ramka2);padding-left:10px;color:var(--tekst2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.czeka{color:var(--uwTekst);background:var(--uwTlo);border-color:var(--uwRamka)}
.pill.tak{color:var(--wolne);border-color:color-mix(in srgb,var(--wolne) 45%,transparent);background:color-mix(in srgb,var(--wolne) 10%,var(--pow))}
.pill.nie{color:var(--zaduzo);border-color:color-mix(in srgb,var(--zaduzo) 45%,transparent);background:var(--zaduzoTlo)}
.pill.pilne{color:#fff;background:var(--zaduzo);border-color:var(--zaduzo)}
.status-w{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:13.5px;color:var(--tekst2)}
.pref-ust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px;margin-top:16px}
.pref-dol{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:16px}
/* wnioski HR */
.wn{border:1px solid var(--ramka);border-left:5px solid var(--ramka2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--pow2)}
.wn.choroba{border-left-color:var(--zaduzo)}.wn.urlop{border-left-color:var(--har)}
.wn .gl{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;align-items:center}
.wn .gl > b button{font-weight:800;font-size:15px}
.wn .gl > b button:hover{text-decoration:underline}
.wn .co{font-size:14px}
.wn .info{font-size:13px;color:var(--tekst2)}
.wn .info b{color:var(--tekst)}
.wn .akcje{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wn .akcje input{flex:1 1 220px;min-height:40px;border-radius:10px;border:1px solid var(--ramka2);background:var(--pow);padding:0 12px;font-size:14px;color:var(--tekst);font-family:inherit;min-width:0}
.btn.tak{background:var(--akcja);color:var(--naAkcji);border-color:transparent}
.btn.nie{color:var(--zaduzo);border-color:color-mix(in srgb,var(--zaduzo) 40%,var(--ramka2))}
.dekl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--ramka);border-radius:12px;background:var(--pow2);font-size:13.5px;align-items:center}
.dekl > span{color:var(--tekst2)}
.dekl b button{font-weight:800}
.dekl b button:hover{text-decoration:underline}
.k.ur{background:var(--harTlo);color:var(--harMocny);border:1.5px solid var(--har);font-size:10.5px}
.k.l4{background:var(--zaduzoTlo);color:var(--zaduzo);border:1.5px solid var(--zaduzo);font-size:9.5px}
.publ{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.info-w{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--tekst2)}
.info-w .btn{min-height:32px;font-size:12.5px}
.prawa{display:grid;grid-template-columns:1.3fr repeat(3,minmax(0,1fr));border:1px solid var(--ramka);border-radius:12px;overflow:hidden;font-size:13px}
.prawa > div{padding:9px 12px;border-bottom:1px solid var(--linia);border-right:1px solid var(--linia)}
.prawa > div:nth-child(4n){border-right:0}
.prawa > div:nth-last-child(-n+4){border-bottom:0}
.prawa .h{background:var(--pow3);font-weight:800;font-size:12px;letter-spacing:.04em}
.prawa .t{color:var(--wolne);font-weight:700}
.prawa .n{color:var(--tekst3)}
.pole .krok,.pole .seg{align-self:flex-start}
@media (max-width:600px){.nag .chip{display:none}.jez button{min-width:36px}}
@media (max-width:640px){.prawa{font-size:11.5px}.prawa > div{padding:8px 6px}.formularz .rzad{grid-template-columns:1fr}}

/* ── v3: Załoga ── */
.k.alt::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--moc);box-shadow:0 0 0 1.5px var(--pow)}
.szuflada.szeroka{width:min(620px,100%)}
.chipy{display:flex;flex-wrap:wrap;gap:6px}
.chipy button{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--ramka);background:var(--pow2);font-size:13px;font-weight:700;color:var(--tekst2);display:inline-flex;align-items:center;gap:6px}
.chipy button[aria-pressed="true"]{background:var(--harTlo);border-color:var(--har);color:var(--harMocny)}
.chipy button.glowna{background:var(--tekst);color:var(--tlo);border-color:var(--tekst);opacity:1}
.chipy button.glowna small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.raty{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.raty span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--ramka);background:var(--pow2);font-variant-numeric:tabular-nums;color:var(--tekst2)}
.raty span.biez{border-color:var(--har);background:var(--harTlo);color:var(--harMocny);font-weight:700}
.poz{border:1px solid var(--ramka);border-radius:12px;padding:10px 12px;background:var(--pow2);display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.poz .gl{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.form-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.form-mini .pole input,.form-mini .pole select{min-height:42px;font-size:15px}
.form-mini .btn{min-height:42px;justify-content:center}
.pole select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ramka2);background:var(--pow2);padding:0 10px;font-size:16px;color:var(--tekst);font-family:inherit}
input[type="search"].szukaj{min-height:38px;border-radius:10px;border:1px solid var(--ramka2);background:var(--pow2);padding:0 12px;font-size:14px;color:var(--tekst);min-width:min(260px,100%);font-family:inherit}
.tab.zal td{white-space:normal;vertical-align:middle}
.tab.zal td.l,.tab.zal th.l{text-align:left}
.tab.zal td.os{min-width:200px}
.mini-chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--ramka);background:var(--pow2);color:var(--tekst2);margin:1px 3px 1px 0;white-space:nowrap}
.mini-chip.F{border-color:var(--Fc);background:color-mix(in srgb,var(--Fc) 14%,var(--pow2))}
.mini-chip.R{border-color:var(--Rc);background:color-mix(in srgb,var(--Rc) 18%,var(--pow2))}
.stan-t{font-size:12px;font-weight:700;color:var(--tekst3)}
.stan-t.ok{color:var(--wolne)}.stan-t.uw{color:var(--pelne)}.stan-t.zle{color:var(--zaduzo)}
.sugestie{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugestie .btn{min-height:32px;font-size:12.5px}
.typy{grid-template-columns:repeat(4,minmax(0,1fr))}
.wn.pozyczka{border-left-color:var(--arch)}
.typ.pozyczka svg{color:var(--arch)}
.typ.pozyczka[aria-pressed="true"]{border-color:var(--arch);background:var(--archTlo);box-shadow:inset 0 0 0 1px var(--arch)}
.seg .licz{min-width:18px;height:18px;font-size:10.5px;margin-left:4px}
@media (max-width:640px){.typy{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ── v4: stawki w rolach, Social Media ── */
:root{--sm:#7A4FA0;--smTlo:#F3ECF8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sm:#CFA3EE;--smTlo:#251B2C}}
:root[data-theme="dark"]{--sm:#CFA3EE;--smTlo:#251B2C}
.k.sm::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:2px;background:var(--sm);box-shadow:0 0 0 1.5px var(--pow)}
.mini-chip.sm{border-color:var(--sm);background:var(--smTlo);color:var(--sm)}
.grupa-rol{display:flex;flex-direction:column;gap:6px}
.grupa-rol + .grupa-rol{margin-top:4px}
.tab.stawki{width:100%}
.tab.stawki th,.tab.stawki td{padding:6px 7px;white-space:normal;vertical-align:middle}
.tab.stawki td.l{min-width:96px;text-align:left}
.tab.stawki td.l .mini-chip{margin:2px 0 0 0}
.tab.stawki input{width:86px;min-height:40px;border-radius:10px;border:1px solid var(--ramka2);background:var(--pow2);padding:0 8px;font-size:16px;font-family:var(--f-mono);text-align:right;color:var(--tekst)}
.tab.stawki input::placeholder{font-family:var(--f-tresc);font-size:11.5px;color:var(--tekst3);text-align:right}
.przyklad{font-size:13px;color:var(--tekst2);border:1px solid color-mix(in srgb,var(--sm) 40%,var(--ramka));background:color-mix(in srgb,var(--smTlo) 70%,var(--pow2));border-radius:10px;padding:8px 11px}
.przyklad b{color:var(--tekst)}
.opcja .mala{max-width:30ch}
.tab.stawki .mala{font-family:var(--f-tresc);font-size:11px}
@media (max-width:420px){.mk-d.zam > span:not(.n){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (max-width:480px){.tab.stawki input{width:72px}.tab.stawki th,.tab.stawki td{padding:5px 4px}.tab.stawki td.l{min-width:84px}}

/* ── v5: zaliczki ── */
.pill.bonus{color:var(--arch);background:var(--archTlo);border-color:color-mix(in srgb,var(--arch) 45%,transparent)}
.poz.zalicz.umorz{background:color-mix(in srgb,var(--archTlo) 55%,var(--pow2))}
sup.gw{font-size:9px;color:var(--arch);margin-left:1px;font-weight:800}
.form-mini .btn{white-space:nowrap;justify-self:start}

/* ── v6: Zarząd ── */
.rola-b.zarz{color:var(--moc);background:color-mix(in srgb,var(--moc) 10%,var(--pow));border-color:color-mix(in srgb,var(--moc) 40%,transparent)}
.sia td.c .ro{width:100%;height:29px;display:grid;place-items:center}
.sia .os .os-ro{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--tekst2)}
.sia .os .os-ro b{color:var(--tekst);font-weight:700}
.wyk-t{width:100%;max-width:820px}
.wyk-t svg{width:100%;height:auto;display:block;overflow:visible}
.wyk-t .siatka{stroke:var(--linia);stroke-width:1}
.wyk-t .os0{stroke:var(--ramka2);stroke-width:1}
.wyk-t text{fill:var(--tekst3);font-size:11px;font-family:var(--f-tresc)}
.wyk-t text.dn{fill:var(--tekst2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.wyk-t text.w{fill:var(--tekst2);font-weight:800;font-size:10.5px;font-variant-numeric:tabular-nums}
.wyk-t .bF{fill:var(--Fc)}
.wyk-t .bR{fill:var(--Rc)}
.wyk-t .sr{stroke:var(--tekst2);stroke-width:1.5;stroke-dasharray:5 4}
.wyk-t rect.hit-t{fill:transparent}
.wyk-t rect.hit-t:hover{fill:color-mix(in srgb,var(--tekst) 5%,transparent)}
.wyk-t rect.hit-t:focus-visible{outline:none;stroke:var(--moc);stroke-width:2}
.leg-w{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--tekst2);margin-top:8px;align-items:center}
.leg-w i{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg-w i.sr{height:0;width:18px;border-top:2px dashed var(--tekst2);border-radius:0;vertical-align:3px}
details.liczby{margin-top:12px}
details.liczby summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--tekst2)}
.tab tr.plan td{background:color-mix(in srgb,var(--harTlo) 55%,var(--pow))}
.prawa{grid-template-columns:1.3fr repeat(4,minmax(0,1fr))}
.prawa > div:nth-child(4n){border-right:1px solid var(--linia)}
.prawa > div:nth-child(5n){border-right:0}
.prawa > div:nth-last-child(-n+4){border-bottom:1px solid var(--linia)}
.prawa > div:nth-last-child(-n+5){border-bottom:0}
:root{--notTlo:#FFF3AD;--notRamka:#DDBD45;--notTekst:#3B3000;--notIk:#FFD43B;--notIkKont:#8A6A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--notTlo:#2F2A10;--notRamka:#7D6B1E;--notTekst:#FFF1A8;--notIk:#F2CC3D;--notIkKont:#FFF1A8}}
:root[data-theme="dark"]{--notTlo:#2F2A10;--notRamka:#7D6B1E;--notTekst:#FFF1A8;--notIk:#F2CC3D;--notIkKont:#FFF1A8}
.notatka-hr textarea{background:var(--notTlo);border-color:var(--notRamka);color:var(--notTekst);box-shadow:0 1px 3px var(--cien)}
.notatka-hr textarea::placeholder{color:color-mix(in srgb,var(--notTekst) 55%,transparent)}
.notatka-hr textarea:focus-visible{outline-color:var(--notIkKont)}
.not-ik{display:inline-grid;place-items:center;width:26px;height:26px;margin-left:4px;border-radius:7px;vertical-align:-6px}
.not-ik:hover{background:var(--pow3)}

/* ── v7: zaliczka z telefonu ── */
.typy{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:640px){.typy{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wn.zaliczka{border-left-color:var(--moc)}
.typ.zaliczka svg{color:var(--moc)}
.typ.zaliczka[aria-pressed="true"]{border-color:var(--moc);background:color-mix(in srgb,var(--moc) 10%,var(--pow2));box-shadow:inset 0 0 0 1px var(--moc)}

/* ── v8: limit zaliczki ── */
.info-lim{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--uwTlo);border:1px solid var(--uwRamka);color:var(--uwTekst);font-size:14px;line-height:1.45}
.info-lim span{flex:1 1 240px}
.info b.ponad{color:var(--zaduzo)}

/* ── v9: minus na następny miesiąc ── */
.rozl .uwaga-r{background:color-mix(in srgb,var(--zaduzoTlo) 70%,var(--pow2));font-size:12.5px}
.rozl .uwaga-r span{color:var(--zaduzo)}

/* ── v10: Karta w Załodze — minimalizm i symetria ── */
.szuflada.szeroka{gap:0}
.szuflada.szeroka > .sz-g{padding-bottom:18px}
.szuflada.szeroka > .sz-sek{gap:10px;padding:18px 0;border-top:1px solid var(--linia)}
.sek-g{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:20px}
.sek-w{font-size:12.5px;color:var(--tekst2);font-variant-numeric:tabular-nums;text-align:right}
.sek-rz .sek-g{align-items:center}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.fg .c2{grid-column:span 2}.fg .c3{grid-column:span 3}.fg .c4{grid-column:span 4}
.fg .pole{gap:5px;min-width:0}
.fg .pole label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg .pole input,.fg .pole select{height:44px;min-height:44px;border-radius:10px;padding:0 12px;font-size:16px}
.fg .btn{height:44px;min-height:44px;border-radius:10px;justify-content:center;font-size:14px}
.fg .stan-t{margin-top:-4px}
@media (max-width:520px){.fg .c2{grid-column:span 3}.fg .p6{grid-column:span 6}}
.rz{border:1px solid var(--ramka);border-radius:12px;padding:10px 12px;background:var(--pow2);display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.rz.umorz{background:color-mix(in srgb,var(--archTlo) 55%,var(--pow2))}
.rz-g{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:32px}
.rz-a{display:inline-flex;align-items:center;gap:6px}
.btn.mini{height:32px;min-height:32px;padding:0 10px;font-size:12.5px;min-width:68px;justify-content:center;border-radius:9px}
.mono-w{font-family:var(--f-mono);font-size:12.5px;color:var(--tekst2)}
.rg{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 12px;align-items:start}
.rg-n{font-size:12px;font-weight:700;color:var(--tekst3);line-height:36px;cursor:help}
@media (max-width:520px){.rg{grid-template-columns:1fr;gap:6px}.rg-n{line-height:1.2}}
.lnk{font-size:12.5px;font-weight:700;color:var(--moc);text-decoration:underline;text-underline-offset:2px}
.tab.stawki input{height:44px;min-height:44px;border-radius:10px}
.rz-a{margin-left:auto}
.tab.stawki input,.fg input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.tab.stawki input::-webkit-outer-spin-button,.tab.stawki input::-webkit-inner-spin-button,.fg input[type="number"]::-webkit-outer-spin-button,.fg input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* ── v11: daty na iPadzie, nagłówek w jednym rzędzie, Wypłaty i widok pracownika na jednej siatce ── */
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;padding:0}
.fg input[type="date"]{line-height:42px}
@supports (-webkit-touch-callout:none){input[type="date"]{display:flex;align-items:center}}
input[type="date"]::-webkit-datetime-edit{padding:0}
@media (min-width:861px){.nag{flex-wrap:nowrap}}
@media (max-width:1280px){.nag-czas{display:none}}
@media (max-width:1200px){.nag .chip{display:none}}
@media (max-width:1100px){.kto .imie{display:none}.nawig-w button{padding:0 10px}}
.jez button{display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.karta-gl.sam{margin-bottom:0}
.fg .c6{grid-column:span 6}
.fg .pole .etykieta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg .pole textarea{border-radius:10px;min-height:88px}
.fg .pole .krok,.fg .pole .seg{align-self:stretch}
.fg .seg{display:flex;flex-wrap:nowrap;width:100%;height:44px;padding:4px;border-radius:10px}
.fg .seg button{flex:1 1 0;min-width:0;min-height:0;height:34px;padding:0 6px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krok.krok-w{display:flex;width:100%;height:44px;padding:4px;border-radius:10px;justify-content:space-between}
.krok.krok-w button{width:40px;height:34px;display:grid;place-items:center}
.krok.krok-w b{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-box{height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;border:1px solid var(--ramka);background:var(--pow3);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tekst);white-space:nowrap;overflow:hidden}
.fg .glowny{width:100%;height:44px;min-height:44px;border-radius:10px;font-size:15px;box-shadow:none}
.fg > .mala,.fg > .blad{margin:0}
.typy{grid-template-columns:repeat(5,minmax(0,1fr))}
.typ span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.typy{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.typ{padding:12px 2px 10px;gap:6px;font-size:11.5px;border-radius:12px}.typ svg{width:26px;height:26px}}
.kafle.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kafle.k4 .kafel .etykieta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.kafle.k4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (max-width:520px){.kafle.k4 .kafel{padding:12px}.kafle.k4 .kafel .w{font-size:21px}}
.tab th[data-tip]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--ramka2)}
@media (min-width:861px) and (max-width:1010px){
  .nag:has(.nawig-w button:nth-child(6)){flex-wrap:wrap;gap:0 10px}
  .nag:has(.nawig-w button:nth-child(6)) .nawig{order:3;flex:1 0 100%;justify-content:flex-start;padding-bottom:10px}
  .nag:has(.nawig-w button:nth-child(6)) .nag-l,.nag:has(.nawig-w button:nth-child(6)) .nag-p{min-height:54px}
  .nag:has(.nawig-w button:nth-child(6)) .nag-p{margin-left:auto}
}
@media (max-width:520px){.typy{gap:4px}.typ{font-size:10.5px;letter-spacing:-.01em;padding:12px 0 10px}}
/* ── v13: Harmonogram na jednej siatce, symetryczne krokomierze, polskie znaki w tytułach ── */
.krok button{display:grid;place-items:center;padding:0}
.krok b{text-align:center}
.ster{justify-content:flex-start}
.ster > .fg:last-child{margin-top:auto;align-items:start}
.ster .karta-gl{margin-bottom:0}
.ster h1{padding-top:.2em}
.karta-gl h2,.sz-g h2{padding-top:.12em}
.ster .fg .glowny{font-size:15px}
.ster .fg .btn{font-size:14px}
.ster .fg .pole > .mala{line-height:1.45}
/* ── v14: kafle w jednym rzędzie, liczba w nagłówku sekcji, wnioski na jednej siatce ── */
.gl-w{font-size:13px;font-weight:600;color:var(--tekst2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kafle.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kafle.k3 .kafel .etykieta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.kafle.k3{grid-template-columns:1fr}}
.kafel[data-tip]{cursor:help}
.wn .akcje{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-flow:column;grid-auto-columns:168px;gap:8px;align-items:stretch}
.wn .akcje input{flex:none;height:44px;min-height:44px}
.wn .akcje .btn{height:44px;min-height:44px;justify-content:center;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.wn .akcje{display:flex;flex-wrap:wrap}.wn .akcje input{flex:1 1 100%}.wn .akcje .btn{flex:1 1 0;min-width:0;padding:0 6px}.wn .akcje .btn svg,.wn .akcje .kw-b{display:none}}
.tip-l{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--ramka2)}
@media (max-width:520px){.kafle.k4 .kafel .etykieta{letter-spacing:.04em}}
@media (max-width:640px){.dz.zamk .os{visibility:hidden}.kal .dz .ogien{display:none}}
/* ── v15: karty ról w równych kolumnach, niepełny ostatni rząd na środku ── */
.spr{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.spr-k{flex:0 0 calc((100% - 24px) / 3);min-width:0}
@media (max-width:980px){.spr-k{flex-basis:calc((100% - 12px) / 2)}}
@media (max-width:640px){.spr-k{flex-basis:100%}}
/* ── v16: Załoga i Koszty — jedna linia opisu, cztery równe kafle; notatka na 7 linii; pola 16 px (bez powiększania na iPadzie) ── */
.notatka-hr textarea{line-height:1.5;height:calc(10.5em + 22px);min-height:calc(10.5em + 22px)}
.narz input[type="search"].szukaj{flex:1 1 100%;height:44px;min-height:44px;font-size:16px}
select.sel,.wn .akcje input{font-size:16px}
.szuflada .wn .akcje{display:flex;flex-wrap:wrap}
.szuflada .wn .akcje input{flex:1 1 100%}
.szuflada .wn .akcje .btn{flex:1 1 0;min-width:0}
.tab.kos td[data-tip]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--ramka2)}
@media (max-width:900px){.kafle.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ── v17: niebieski kafelek „i” — aktualna instrukcja (kolor i litera jak w transport.dysza.app) ── */
.ikbtn.info-i{background:#2f74c0;border-color:#2f74c0;color:#fff;font:italic 700 23px/1 Georgia,"Times New Roman",serif;text-decoration:none;padding:0 1px 1px 0}
.ikbtn.info-i:hover{background:#2865a8;border-color:#2865a8}
@media (max-width:380px){.nag-p{gap:8px}}

    function htmlKafelki() {
